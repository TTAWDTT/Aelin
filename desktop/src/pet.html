<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      #petWrap {
        position: relative;
        width: 236px;
        height: 236px;
        pointer-events: auto;
      }
      #petShell {
        position: absolute;
        left: 50%;
        top: 67%;
        transform: translate(-50%, -50%);
      }
      #pet {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
        object-fit: cover;
        cursor: grab;
        transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
        pointer-events: auto;
      }
      #pet:hover {
        transform: scale(1.035);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.4);
      }
      #pet.dragging {
        cursor: grabbing;
        transform: none;
        transition: none;
      }
      #pet.dragging:hover {
        transform: none;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
      }
      #pet.pressing {
        transform: none;
      }
      #pet[data-state="resting"] {
        filter: saturate(0.92) brightness(0.94);
      }
      #pet[data-state="working"] {
        filter: saturate(1.18) brightness(1.02);
      }
      #pet[data-state="completed"] {
        filter: saturate(1.08) brightness(1.05);
      }
      #pet[data-state="happy"] {
        filter: none;
      }
      #stateBadge {
        position: absolute;
        left: 50%;
        bottom: -12px;
        transform: translateX(-50%);
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        line-height: 14px;
        color: #f4f4f5;
        background: rgba(15, 23, 42, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
        white-space: nowrap;
        pointer-events: none;
      }
      .pet-panel {
        position: absolute;
        left: 50%;
        width: 212px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: rgba(16, 23, 36, 0.82);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
        color: #f9fafb;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 4px);
        transition: opacity 140ms ease, transform 140ms ease;
      }
      .pet-hover .pet-panel {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .pet-panel.hidden {
        display: none;
      }
      #musicPanel {
        top: -56px;
        padding: 8px 10px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-blend-mode: overlay;
        overflow: hidden;
        isolation: isolate;
      }
      #musicPanel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.5);
        z-index: 2;
        pointer-events: none;
      }
      #musicPanel::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.2));
        z-index: 0;
        pointer-events: none;
      }
      #musicPanel.with-cover {
        background-color: rgba(7, 12, 20, 0.74);
      }
      #musicTitle {
        position: relative;
        z-index: 1;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #musicMeta {
        position: relative;
        z-index: 1;
        margin-top: 2px;
        font-size: 10px;
        color: rgba(226, 232, 240, 0.88);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #musicControls {
        position: relative;
        z-index: 1;
        margin-top: 8px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 6px;
      }
      .music-btn {
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(15, 23, 42, 0.62);
        color: #f8fafc;
        border-radius: 9px;
        height: 28px;
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .music-btn:hover:not(:disabled) {
        background: rgba(30, 41, 59, 0.82);
        border-color: rgba(255, 255, 255, 0.36);
        transform: translateY(-1px);
      }
      .music-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .music-btn svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      #btnPlay {
        background: rgba(13, 148, 136, 0.28);
        border-color: rgba(45, 212, 191, 0.36);
      }
      #btnPlay:hover:not(:disabled) {
        background: rgba(13, 148, 136, 0.4);
        border-color: rgba(94, 234, 212, 0.56);
      }
      #volumeWrap {
        grid-column: span 3;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #volumeSlider {
        width: 100%;
        accent-color: #f8fafc;
      }
      .icon-only {
        display: inline-flex;
      }
      #workPanel {
        bottom: 4px;
        padding: 8px 10px;
      }
      #workText {
        font-size: 11px;
        line-height: 1.4;
      }
      #coachText {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.4;
        color: rgba(191, 219, 254, 0.95);
      }
      #coachText.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="petWrap">
      <div id="musicPanel" class="pet-panel hidden">
        <div id="musicTitle">未播放音乐</div>
        <div id="musicMeta">将自动显示曲名和歌手</div>
        <div id="musicControls">
          <button class="music-btn" id="btnPrev" type="button" aria-label="上一首"></button>
          <button class="music-btn" id="btnPlay" type="button" aria-label="播放或暂停"></button>
          <button class="music-btn" id="btnNext" type="button" aria-label="下一首"></button>
          <div id="volumeWrap">
            <button class="music-btn" id="btnVolDown" type="button" aria-label="降低音量"></button>
            <input id="volumeSlider" type="range" min="0" max="100" value="50" step="2" />
            <button class="music-btn" id="btnVolUp" type="button" aria-label="提高音量"></button>
          </div>
        </div>
      </div>

      <div id="petShell">
        <img id="pet" alt="Aelin" draggable="false" />
        <div id="stateBadge">开心</div>
      </div>

      <div id="workPanel" class="pet-panel">
        <div id="workText">当前没有检测到工作进程哦主人~</div>
        <div id="coachText" class="hidden"></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      let fallbackIcon = params.get("icon") || "";

      const wrap = document.getElementById("petWrap");
      const pet = document.getElementById("pet");
      const badge = document.getElementById("stateBadge");
      const musicPanel = document.getElementById("musicPanel");
      const musicTitle = document.getElementById("musicTitle");
      const musicMeta = document.getElementById("musicMeta");
      const btnPrev = document.getElementById("btnPrev");
      const btnPlay = document.getElementById("btnPlay");
      const btnNext = document.getElementById("btnNext");
      const btnVolDown = document.getElementById("btnVolDown");
      const btnVolUp = document.getElementById("btnVolUp");
      const volumeSlider = document.getElementById("volumeSlider");
      const workPanel = document.getElementById("workPanel");
      const workText = document.getElementById("workText");
      const coachText = document.getElementById("coachText");

      const stateLabels = {
        happy: "开心",
        completed: "完成",
        resting: "休息",
        working: "工作",
      };

      let stateAssets = {};
      let clickThroughEnabled = true;
      let currentState = "happy";
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let activePointerId = null;
      let pointerActive = false;
      let deactivateTimer = null;
      let volumeDebounceTimer = null;
      let latestMedia = null;
      let hoverSyncRaf = 0;
      let pendingHoverPoint = null;
      const DEACTIVATE_DELAY_MS = 90;
      const iconMarkup = {
        prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-8.5 6L18 18V6Z"></path><path d="M7 6v12"></path></svg>',
        next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8.5 6L6 18V6Z"></path><path d="M17 6v12"></path></svg>',
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l10 6-10 6V6Z"></path></svg>',
        pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg>',
        volDown: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 7.8 9H5v6h2.8L11 18V6Z"></path><path d="M15 12h4"></path></svg>',
        volUp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 7.8 9H5v6h2.8L11 18V6Z"></path><path d="M15 12h4"></path><path d="M17 10v4"></path></svg>',
      };

      function setButtonIcon(button, name) {
        if (!button) return;
        button.innerHTML = iconMarkup[name] || "";
      }

      setButtonIcon(btnPrev, "prev");
      setButtonIcon(btnPlay, "play");
      setButtonIcon(btnNext, "next");
      setButtonIcon(btnVolDown, "volDown");
      setButtonIcon(btnVolUp, "volUp");

      function hashHue(input) {
        const text = String(input || "");
        let hash = 0;
        for (let i = 0; i < text.length; i += 1) {
          hash = (hash * 31 + text.charCodeAt(i)) % 360;
        }
        return Math.abs(hash % 360);
      }

      function buildFallbackCover(title, artist, app) {
        const key = `${title}|${artist}|${app}`;
        const hue = hashHue(key);
        const hueB = (hue + 55) % 360;
        const hueC = (hue + 140) % 360;
        const svg = [
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 100'>",
          `<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='hsl(${hue} 85% 56%)'/><stop offset='1' stop-color='hsl(${hueB} 88% 58%)'/></linearGradient></defs>`,
          "<rect width='220' height='100' fill='url(#g)'/>",
          `<circle cx='174' cy='18' r='32' fill='hsl(${hueC} 85% 60% / 0.28)'/>`,
          "<path d='M0 68 C 36 48, 72 88, 108 68 S 180 46, 220 66 L220 100 L0 100 Z' fill='rgba(255,255,255,0.18)'/>",
          "<path d='M0 78 C 36 58, 72 98, 108 78 S 180 56, 220 76 L220 100 L0 100 Z' fill='rgba(0,0,0,0.14)'/>",
          "</svg>",
        ].join("");
        const encoded = encodeURIComponent(svg).replace(/%20/g, " ");
        return `linear-gradient(rgba(8,12,20,0.42), rgba(8,12,20,0.82)), url(\"data:image/svg+xml,${encoded}\")`;
      }

      function normalizeState(raw) {
        const value = String(raw || "").trim().toLowerCase();
        if (value === "happy" || value === "completed" || value === "resting" || value === "working") return value;
        if (value === "active") return "happy";
        if (value === "idle" || value === "sleep") return "resting";
        if (value === "busy" || value === "focus") return "working";
        return "happy";
      }

      function stateLabel(state, payload) {
        const base = stateLabels[state] || stateLabels.happy;
        const idleSec = Number(payload?.idleSec || 0);
        if (state === "resting" && idleSec > 0) {
          return `${base} ${Math.floor(idleSec)}s`;
        }
        if (state === "working") {
          const mins = Number(payload?.workDurationMin || 0);
          if (mins > 0) return `${base} ${mins}m`;
        }
        return base;
      }

      function sourceForState(state) {
        return stateAssets[state] || stateAssets.happy || fallbackIcon || "";
      }

      function setHoverActive(active) {
        wrap.classList.toggle("pet-hover", Boolean(active));
      }

      function setMusicPanel(payload) {
        const media = payload?.media && typeof payload.media === "object" ? payload.media : null;
        latestMedia = media;
        const musicNames = Array.isArray(payload?.musicDisplayNames)
          ? payload.musicDisplayNames.filter((item) => typeof item === "string" && item.trim())
          : [];
        const hasMediaDetail = !!(media && (media.title || media.artist || media.app));
        const hasMusic = Boolean(payload?.hasMusic) || musicNames.length > 0 || hasMediaDetail;
        musicPanel.classList.toggle("hidden", !hasMusic);
        if (!hasMusic) return;

        const fallbackPlayer = musicNames[0] || String(media?.app || "").trim() || "音乐播放器";
        const title = String(media?.title || "").trim() || `${fallbackPlayer} 正在运行`;
        const artist = String(media?.artist || "").trim();
        const status = media?.isPlaying ? "播放中" : "待机中";
        const app = String(media?.app || "").trim();
        const coverDataUrl = String(media?.coverDataUrl || "").trim();

        musicTitle.textContent = title;
        musicMeta.textContent = [artist || fallbackPlayer, status, app].filter(Boolean).join(" · ");
        if (coverDataUrl) {
          musicPanel.classList.add("with-cover");
          musicPanel.style.backgroundImage = `linear-gradient(rgba(8,12,20,0.45), rgba(8,12,20,0.8)), url('${coverDataUrl}')`;
        } else {
          musicPanel.classList.add("with-cover");
          musicPanel.style.backgroundImage = buildFallbackCover(title, artist || fallbackPlayer, app || fallbackPlayer);
        }

        const mediaControllable = Boolean(media && media.available && (media.canPlay || media.canPause || media.canNext || media.canPrev));
        btnPrev.disabled = !hasMusic || (mediaControllable && !media?.canPrev);
        btnNext.disabled = !hasMusic || (mediaControllable && !media?.canNext);
        btnPlay.disabled = !hasMusic || (mediaControllable && !(media?.canPlay || media?.canPause));
        setButtonIcon(btnPlay, media?.isPlaying ? "pause" : "play");

        const volume = Number(media?.volume);
        if (Number.isFinite(volume)) {
          volumeSlider.value = String(Math.max(0, Math.min(100, Math.round(volume))));
        }
      }

      function setWorkPanel(payload) {
        const narration = String(payload?.workNarration || "").trim() || "当前没有检测到工作进程哦主人~";
        workText.textContent = narration;

        const line = String(payload?.coachLine || "").trim();
        if (line) {
          coachText.textContent = line;
          coachText.classList.remove("hidden");
        } else {
          coachText.textContent = "";
          coachText.classList.add("hidden");
        }
      }

      function applyState(payload, force = false) {
        const nextState = normalizeState(payload?.state || currentState);
        const sameState = nextState === currentState;

        if (!sameState || force) {
          currentState = nextState;
          pet.dataset.state = nextState;
          const src = sourceForState(nextState);
          if (src && pet.src !== src) {
            pet.src = src;
          }
        }

        badge.textContent = stateLabel(nextState, payload);
        setMusicPanel(payload || {});
        setWorkPanel(payload || {});
      }

      function applyConfig(config, force = false) {
        if (config && typeof config === "object") {
          if (config.icon) fallbackIcon = String(config.icon);
          if (config.stateAssets && typeof config.stateAssets === "object") {
            stateAssets = { ...config.stateAssets };
          }
          if (typeof config.clickThroughEnabled === "boolean") {
            clickThroughEnabled = config.clickThroughEnabled;
            if (!clickThroughEnabled) {
              clearDeactivateTimer();
              setPointerActive(true);
            } else {
              setPointerActive(false);
            }
          }
        }
        applyState({ state: config?.state || currentState }, force);
      }

      function isInsidePet(clientX, clientY) {
        const rect = pet.getBoundingClientRect();
        if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) {
          return false;
        }
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const radius = rect.width / 2;
        return dx * dx + dy * dy <= radius * radius * 0.94;
      }

      function isInsideRect(el, clientX, clientY, pad = 2) {
        if (!wrap.classList.contains("pet-hover")) return false;
        if (!el || el.classList.contains("hidden")) return false;
        const rect = el.getBoundingClientRect();
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function isInsideInteractive(clientX, clientY) {
        if (isInsidePet(clientX, clientY)) return true;
        if (isInsideRect(musicPanel, clientX, clientY, 3)) return true;
        if (isInsideRect(workPanel, clientX, clientY, 3)) return true;
        return false;
      }

      function clearDeactivateTimer() {
        if (!deactivateTimer) return;
        clearTimeout(deactivateTimer);
        deactivateTimer = null;
      }

      function schedulePointerInactive() {
        if (!clickThroughEnabled || dragging) return;
        clearDeactivateTimer();
        deactivateTimer = setTimeout(() => {
          deactivateTimer = null;
          setPointerActive(false);
        }, DEACTIVATE_DELAY_MS);
      }

      function syncPointerByPoint(clientX, clientY) {
        if (!clickThroughEnabled) {
          setPointerActive(true);
          return;
        }
        if (isInsideInteractive(clientX, clientY)) {
          clearDeactivateTimer();
          setPointerActive(true);
          return;
        }
        schedulePointerInactive();
      }

      function setPointerActive(next) {
        const active = Boolean(next);
        if (!clickThroughEnabled) {
          if (!pointerActive) {
            pointerActive = true;
            window.petBridge?.setPointerActive(true);
          }
          setHoverActive(true);
          return;
        }
        if (pointerActive === active) {
          const nextHover = active || dragging;
          if (wrap.classList.contains("pet-hover") !== nextHover) {
            setHoverActive(nextHover);
          }
          return;
        }
        pointerActive = active;
        setHoverActive(active || dragging);
        window.petBridge?.setPointerActive(active);
      }

      function scheduleHoverSync(clientX, clientY) {
        pendingHoverPoint = { x: clientX, y: clientY };
        if (hoverSyncRaf) return;
        hoverSyncRaf = window.requestAnimationFrame(() => {
          hoverSyncRaf = 0;
          const point = pendingHoverPoint;
          pendingHoverPoint = null;
          if (!point || dragging) return;
          syncPointerByPoint(point.x, point.y);
        });
      }

      async function runMediaAction(action, payload = {}) {
        try {
          const result = await window.petBridge?.mediaControl?.(action, payload);
          if (result?.state) {
            applyState(result.state, true);
          }
        } catch {
          // ignore control errors in UI
        }
      }

      btnPrev.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("previous");
      });
      btnPlay.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const action = latestMedia?.isPlaying ? "pause" : "play";
        const canDirect = latestMedia?.isPlaying ? latestMedia?.canPause : latestMedia?.canPlay;
        runMediaAction(canDirect ? action : "play_pause");
      });
      btnNext.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("next");
      });
      btnVolDown.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("volume_down");
      });
      btnVolUp.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("volume_up");
      });
      volumeSlider.addEventListener("input", (event) => {
        event.stopPropagation();
        const value = Number(event.target?.value || 0);
        if (volumeDebounceTimer) clearTimeout(volumeDebounceTimer);
        volumeDebounceTimer = setTimeout(() => {
          runMediaAction("set_volume", { value });
        }, 150);
      });

      pet.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        window.petBridge?.openMenu({
          screenX: event.screenX,
          screenY: event.screenY,
        });
      });

      pet.addEventListener("mouseup", (event) => {
        if (event.button !== 2) return;
        event.preventDefault();
        window.petBridge?.openMenu({
          screenX: event.screenX,
          screenY: event.screenY,
        });
      });

      pet.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || !event.isPrimary) return;
        event.preventDefault();
        clearDeactivateTimer();
        setPointerActive(true);
        dragging = true;
        moved = false;
        activePointerId = event.pointerId;
        startX = event.screenX;
        startY = event.screenY;
        if (typeof pet.setPointerCapture === "function") {
          try {
            pet.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        const localX = event.clientX;
        const localY = event.clientY;
        pet.classList.add("dragging");
        pet.classList.add("pressing");
        window.petBridge?.dragStart({
          screenX: event.screenX,
          screenY: event.screenY,
          localX,
          localY,
        });
      });

      pet.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        if (!event.isPrimary || event.pointerId !== activePointerId) return;
        const dx = Math.abs(event.screenX - startX);
        const dy = Math.abs(event.screenY - startY);
        if (dx > 2 || dy > 2) moved = true;
        window.petBridge?.dragMove({ screenX: event.screenX, screenY: event.screenY });
      });

      function finishPointerDrag(event, cancelled = false) {
        if (!dragging) return;
        if (event && event.pointerId !== undefined && event.pointerId !== activePointerId) return;
        const wasMoved = moved;
        dragging = false;
        moved = false;
        const pointerId = activePointerId;
        activePointerId = null;
        if (pointerId !== null && typeof pet.releasePointerCapture === "function") {
          try {
            if (typeof pet.hasPointerCapture !== "function" || pet.hasPointerCapture(pointerId)) {
              pet.releasePointerCapture(pointerId);
            }
          } catch {
            // ignore release capture failures
          }
        }
        pet.classList.remove("dragging");
        pet.classList.remove("pressing");
        window.petBridge?.dragEnd();
        if (!cancelled && !wasMoved && event?.button === 0) {
          window.petBridge?.openChat();
        }
        if (event) {
          syncPointerByPoint(event.clientX, event.clientY);
        } else {
          schedulePointerInactive();
        }
      }

      pet.addEventListener("pointerup", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, false);
      });

      pet.addEventListener("pointercancel", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, true);
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) {
          scheduleHoverSync(event.clientX, event.clientY);
        }
      });

      pet.addEventListener("dblclick", (event) => {
        event.preventDefault();
        window.petBridge?.openChat();
      });

      [pet, musicPanel, workPanel].forEach((el) => {
        el?.addEventListener("mouseenter", (event) => {
          if (dragging) return;
          syncPointerByPoint(event.clientX, event.clientY);
        });
      });

      window.addEventListener("mouseleave", () => {
        if (!dragging) schedulePointerInactive();
      });

      const offState = window.petBridge?.onState?.((payload) => {
        applyState(payload || {});
      });
      const offConfig = window.petBridge?.onConfig?.((payload) => {
        applyConfig(payload || {});
      });

      window.petBridge?.getConfig?.().then((config) => {
        applyConfig(config || {}, true);
      }).catch(() => {
        if (fallbackIcon) pet.src = fallbackIcon;
      });

      if (fallbackIcon && !pet.getAttribute("src")) {
        pet.src = fallbackIcon;
      }

      window.addEventListener("beforeunload", () => {
        clearDeactivateTimer();
        if (volumeDebounceTimer) clearTimeout(volumeDebounceTimer);
        if (hoverSyncRaf) window.cancelAnimationFrame(hoverSyncRaf);
        if (typeof offState === "function") offState();
        if (typeof offConfig === "function") offConfig();
      });
    </script>
  </body>
</html>
