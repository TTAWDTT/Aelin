<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
        font-family: "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      }
      #petWrap {
        position: relative;
        width: 100%;
        height: 100%;
        --pet-center-x: 64px;
        --pet-center-y: 50%;
        --controls-left: 6px;
        --controls-top: 6px;
        --controls-entry-x: 8px;
        --controls-entry-y: 0px;
        --panel-width: 248px;
        --panel-height: 64px;
        --control-size: 22px;
        --control-gap: 4px;
        --surface-bg: rgba(244, 242, 236, 0.94);
        --surface-border: rgba(37, 34, 30, 0.12);
        --surface-muted: rgba(37, 34, 30, 0.05);
        --surface-active: rgba(37, 34, 30, 0.08);
        --ink-strong: #1f1c18;
        --ink-soft: #7a746b;
        --entity-fill: #181614;
        --entity-line: rgba(37, 34, 30, 0.16);
        --entity-accent: #6d7d89;
        --symbol-width: 12px;
        --symbol-height: 58px;
        --symbol-radius: 999px;
        --symbol-rotate: 0deg;
        --symbol-shift-y: 0px;
        --symbol-opacity: 0.92;
        --symbol-slit-width: 18px;
        --symbol-slit-opacity: 0.28;
        --shard-width: 14px;
        --shard-height: 1.5px;
        --shard-x: -10px;
        --shard-y: -12px;
        --shard-rotate: -28deg;
        --shard-opacity: 0.48;
        --shard-drift-x: 2px;
        --shard-drift-y: -2px;
        --shard-drift-rotate: 10deg;
        --echo-x: 18px;
        --echo-y: -18px;
        --echo-width: 20px;
        --echo-height: 1.5px;
        --echo-dot-size: 4px;
        --echo-rotate: -14deg;
        --echo-opacity: 0.54;
        --echo-drift-x: 3px;
        --echo-drift-y: -4px;
        --echo-drift-rotate: 8deg;
        --glyph-duration: 8.8s;
        --echo-duration: 6.8s;
        --shard-duration: 9.8s;
        --glyph-drift-x: 0.7px;
        --glyph-drift-y: 3px;
        --glyph-turn: 1.1deg;
        pointer-events: auto;
      }
      #statusPanel {
        position: absolute;
        left: var(--controls-left);
        top: var(--controls-top);
        box-sizing: border-box;
        width: min(var(--panel-width), calc(100% - 12px));
        min-height: var(--panel-height);
        padding: 8px 10px 8px 14px;
        border-radius: 0;
        border: none;
        background: linear-gradient(90deg, var(--surface-bg) 0%, rgba(244, 242, 236, 0.72) 62%, rgba(244, 242, 236, 0) 100%);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        opacity: 0;
        pointer-events: none;
        transform: translate3d(var(--controls-entry-x), var(--controls-entry-y), 0);
        transform-origin: center;
        will-change: opacity, transform;
        backface-visibility: hidden;
        transition: opacity 150ms ease, transform 170ms ease, border-color 170ms ease, background 170ms ease;
      }
      #statusPanel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 9px;
        bottom: 9px;
        width: 1px;
        background: var(--surface-border);
        opacity: 0.86;
      }
      .panels-visible #statusPanel {
        opacity: 1;
        transform: translate3d(0, 0, 0);
        pointer-events: auto;
      }
      #petWrap.dragging-panels-hidden #statusPanel {
        opacity: 0 !important;
        pointer-events: none !important;
        transform: translate3d(var(--controls-entry-x), var(--controls-entry-y), 0) !important;
      }
      #speechLine {
        color: var(--ink-strong);
        width: 100%;
        font-size: 11.5px;
        line-height: 1.46;
        font-weight: 500;
        min-height: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        white-space: normal;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.04em;
        word-break: break-word;
        text-wrap: pretty;
      }
      #mediaRow {
        display: none;
      }
      #mediaTitle {
        display: none;
      }
      #petShell {
        position: absolute;
        left: var(--pet-center-x);
        top: var(--pet-center-y);
        transform: translate(-50%, -50%);
        will-change: transform;
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
      }
      #petFrame {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #petGlyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        animation: glyphFloat var(--glyph-duration) cubic-bezier(0.37, 0, 0.2, 1) infinite;
      }
      #petSymbol,
      #petEcho {
        position: absolute;
        transition:
          transform 240ms ease,
          background 220ms ease,
          border-color 220ms ease,
          color 220ms ease,
          font-size 220ms ease,
          width 220ms ease,
          height 220ms ease,
          opacity 220ms ease;
      }
      #petSymbol {
        position: relative;
        width: var(--symbol-width);
        height: var(--symbol-height);
        border-radius: var(--symbol-radius);
        background: var(--entity-fill);
        color: var(--entity-fill);
        opacity: var(--symbol-opacity);
        transform-origin: center 78%;
        transform: translate3d(0, var(--symbol-shift-y), 0) rotate(var(--symbol-rotate));
      }
      #petSymbol::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 34%;
        width: var(--symbol-slit-width);
        height: 1px;
        background: rgba(244, 242, 236, 0.58);
        opacity: var(--symbol-slit-opacity);
        transform: translate3d(-34%, -50%, 0) rotate(-28deg);
      }
      #petSymbol::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--shard-width);
        height: var(--shard-height);
        border-radius: 999px;
        background: var(--entity-accent);
        opacity: var(--shard-opacity);
        transform: translate3d(var(--shard-x), var(--shard-y), 0) rotate(var(--shard-rotate));
        transform-origin: center;
        animation: shardSweep var(--shard-duration) cubic-bezier(0.37, 0, 0.2, 1) infinite;
      }
      #petEcho {
        position: relative;
        width: var(--echo-width);
        height: var(--echo-height);
        border-radius: 999px;
        background: currentColor;
        color: var(--entity-accent);
        opacity: var(--echo-opacity);
        transform: translate3d(var(--echo-x), var(--echo-y), 0) rotate(var(--echo-rotate));
        animation: echoDrift var(--echo-duration) cubic-bezier(0.37, 0, 0.2, 1) infinite;
      }
      #petEcho::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 0;
        width: var(--echo-dot-size);
        height: var(--echo-dot-size);
        border-radius: 50%;
        background: currentColor;
        transform: translate(38%, -50%);
      }
      #pet {
        position: absolute;
        inset: 10px;
        width: 100px;
        height: 100px;
        opacity: 0;
        border-radius: 50%;
        border: none;
        box-shadow: none;
        object-fit: contain;
        cursor: grab;
        transition: transform 140ms ease, opacity 140ms ease;
        pointer-events: auto;
        transform: translate3d(0, 0, 0) scale(1);
      }
      #pet:hover {
        box-shadow: none;
      }
      #pet.dragging {
        cursor: grabbing;
        transform: none;
        transition: none;
      }
      #pet.dragging:hover {
        transform: none;
        box-shadow: none;
      }
      #pet.pressing {
        transform: translate3d(0, 1px, 0) scale(0.99);
      }
      #controlRail {
        display: flex;
        gap: 4px;
        pointer-events: auto;
        align-items: center;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      #controlRail.hidden {
        display: none;
      }
      .control-btn {
        border: 1px solid var(--surface-border);
        background: transparent;
        color: var(--ink-strong);
        border-radius: 999px;
        width: var(--control-size);
        height: var(--control-size);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          transform 120ms ease;
      }
      .control-btn:hover:not(:disabled) {
        background: var(--surface-muted);
        border-color: rgba(42, 40, 35, 0.2);
        transform: none;
      }
      .control-btn:active:not(:disabled) {
        background: var(--surface-active);
        transform: none;
      }
      .control-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .control-btn svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      #petWrap[data-music="1"] #petSymbol {
        transform: translate3d(0, var(--symbol-shift-y), 0) rotate(calc(var(--symbol-rotate) + 2deg));
      }
      @keyframes glyphFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(-0.2deg);
        }
        42% {
          transform: translate3d(var(--glyph-drift-x), calc(var(--glyph-drift-y) * -1), 0) rotate(var(--glyph-turn));
        }
        76% {
          transform: translate3d(calc(var(--glyph-drift-x) * -0.5), calc(var(--glyph-drift-y) * -0.2), 0) rotate(-0.5deg);
        }
      }
      @keyframes echoDrift {
        0%,
        100% {
          transform: translate3d(var(--echo-x), var(--echo-y), 0) rotate(var(--echo-rotate));
        }
        50% {
          transform: translate3d(calc(var(--echo-x) + var(--echo-drift-x)), calc(var(--echo-y) + var(--echo-drift-y)), 0)
            rotate(calc(var(--echo-rotate) + var(--echo-drift-rotate)));
        }
      }
      @keyframes shardSweep {
        0%,
        100% {
          transform: translate3d(var(--shard-x), var(--shard-y), 0) rotate(var(--shard-rotate));
        }
        50% {
          transform: translate3d(calc(var(--shard-x) + var(--shard-drift-x)), calc(var(--shard-y) + var(--shard-drift-y)), 0)
            rotate(calc(var(--shard-rotate) + var(--shard-drift-rotate)));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #statusPanel,
        .control-btn,
        #pet,
        #petGlyph,
        #petSymbol,
        #petEcho {
          transition-duration: 80ms !important;
          transition-delay: 0ms !important;
          animation: none !important;
        }
        #statusPanel,
        .control-btn {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="petWrap">
      <div id="statusPanel" aria-live="polite">
        <div id="speechLine">我在。</div>
        <div id="mediaRow" class="hidden">
          <div id="mediaTitle">暂无播放</div>
          <div id="controlRail" class="hidden" aria-label="音乐控制">
            <button class="control-btn" id="btnPrev" type="button" aria-label="上一首"></button>
            <button class="control-btn" id="btnPlay" type="button" aria-label="播放或暂停"></button>
            <button class="control-btn" id="btnNext" type="button" aria-label="下一首"></button>
          </div>
        </div>
      </div>

      <div id="petShell">
        <div id="petFrame">
          <div id="petGlyph" aria-hidden="true">
            <div id="petSymbol"></div>
            <div id="petEcho"></div>
          </div>
          <img id="pet" alt="Aelin" draggable="false" />
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      let fallbackIcon = params.get("icon") || "";
      const debugEnabled = params.get("debug") === "1";
      let debugSeq = 0;

      const wrap = document.getElementById("petWrap");
      const statusPanel = document.getElementById("statusPanel");
      const pet = document.getElementById("pet");
      const speechLine = document.getElementById("speechLine");
      const mediaRow = document.getElementById("mediaRow");
      const mediaTitle = document.getElementById("mediaTitle");
      const controlRail = document.getElementById("controlRail");
      const btnPrev = document.getElementById("btnPrev");
      const btnPlay = document.getElementById("btnPlay");
      const btnNext = document.getElementById("btnNext");
      const moodThemes = {
        calm: {
          fill: "#191714",
          accent: "#6e7d88",
          line: "rgba(37, 34, 30, 0.16)",
          surface: "rgba(244, 242, 236, 0.94)",
        },
        warming_up: {
          fill: "#1b1713",
          accent: "#8b7863",
          line: "rgba(52, 41, 30, 0.16)",
          surface: "rgba(245, 240, 232, 0.95)",
        },
        focused: {
          fill: "#15181c",
          accent: "#61778e",
          line: "rgba(39, 49, 60, 0.18)",
          surface: "rgba(239, 243, 247, 0.94)",
        },
        flow: {
          fill: "#151917",
          accent: "#66827c",
          line: "rgba(34, 50, 45, 0.17)",
          surface: "rgba(239, 244, 241, 0.94)",
        },
        deep_focus: {
          fill: "#121518",
          accent: "#52667a",
          line: "rgba(32, 43, 53, 0.18)",
          surface: "rgba(236, 241, 246, 0.95)",
        },
        recharging: {
          fill: "#1a1714",
          accent: "#847364",
          line: "rgba(48, 40, 33, 0.16)",
          surface: "rgba(245, 241, 235, 0.95)",
        },
        sleepy: {
          fill: "#17171a",
          accent: "#78758a",
          line: "rgba(38, 38, 48, 0.16)",
          surface: "rgba(240, 239, 245, 0.95)",
        },
        strained: {
          fill: "#1c1614",
          accent: "#8b675d",
          line: "rgba(60, 40, 34, 0.17)",
          surface: "rgba(245, 239, 236, 0.95)",
        },
      };

      let stateAssets = {};
      let clickThroughEnabled = true;
      let currentState = "happy";
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let activePointerId = null;
      let pointerActive = false;
      let deactivateTimer = null;
      let latestMedia = null;
      let hoverSyncRaf = 0;
      let pendingHoverPoint = null;
      let layoutSyncRaf = 0;
      let panelsVisibleRaf = 0;
      let compactCommitTimer = 0;
      let lastLayoutKey = "";
      let desiredHoverActive = false;
      let visualLayoutMode = "compact";
      let lastInsideInteractiveAt = 0;
      let pointerActivatedAt = 0;
      let suppressExpandUntil = 0;
      let mediaControlIntentSeq = 0;
      let pendingPlayVisual = null;
      let controlsPlacementLock = "";
      let lastAppliedBounds = null;
      let currentAnchorX = 64;
      let currentAnchorY = 64;
      let lastPayload = {};
      const petLayoutConfig = {
        compactSize: 128,
      };
      const DEACTIVATE_DELAY_MS = 180;
      const HOVER_SAFE_ZONE_PADDING = 12;
      const PANEL_FADE_MS = 100;
      const POINTER_ACTIVE_HOLD_MS = 140;
      const DRAG_END_REOPEN_GUARD_MS = 260;
      const PLAY_VISUAL_STALE_GUARD_MS = 1200;
      const PET_RADIUS = 50;
      const PANEL_WIDTH = 248;
      const PANEL_HEIGHT = 64;
      const PANEL_GAP = 12;
      const PANEL_MARGIN = 6;
      const PANEL_TOP_BOTTOM_WIDTH = 252;
      const iconMarkup = {
        prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-8.5 6L18 18V6Z"></path><path d="M7 6v12"></path></svg>',
        next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8.5 6L6 18V6Z"></path><path d="M17 6v12"></path></svg>',
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l10 6-10 6V6Z"></path></svg>',
        pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg>',
      };

      function petDebug(tag, data = {}) {
        if (!debugEnabled) return;
        debugSeq += 1;
        const payload = {
          tag: String(tag || "event"),
          seq: debugSeq,
          ts: Date.now(),
          data: data && typeof data === "object" ? data : { value: String(data || "") },
        };
        try {
          window.petBridge?.debugLog?.(payload);
        } catch {
          // ignore debug bridge failures
        }
      }

      function setButtonIcon(button, name) {
        if (!button) return;
        button.innerHTML = iconMarkup[name] || "";
      }

      setButtonIcon(btnPrev, "prev");
      setButtonIcon(btnPlay, "play");
      setButtonIcon(btnNext, "next");

      function getScreenWorkArea() {
        const left = Number(window.screen?.availLeft ?? 0);
        const top = Number(window.screen?.availTop ?? 0);
        const width = Number(window.screen?.availWidth || window.screen?.width || 1920);
        const height = Number(window.screen?.availHeight || window.screen?.height || 1080);
        return {
          left,
          top,
          right: left + width,
          bottom: top + height,
        };
      }

      function getCurrentWindowBounds() {
        const liveX = Number(window.screenX);
        const liveY = Number(window.screenY);
        const liveW = Number(window.innerWidth || document.documentElement?.clientWidth || petLayoutConfig.compactSize);
        const liveH = Number(window.innerHeight || document.documentElement?.clientHeight || petLayoutConfig.compactSize);
        if (Number.isFinite(liveX) && Number.isFinite(liveY) && Number.isFinite(liveW) && Number.isFinite(liveH)) {
          return {
            x: liveX,
            y: liveY,
            width: liveW,
            height: liveH,
          };
        }
        if (lastAppliedBounds && Number.isFinite(lastAppliedBounds.x) && Number.isFinite(lastAppliedBounds.y)) {
          return {
            x: Number(lastAppliedBounds.x),
            y: Number(lastAppliedBounds.y),
            width: Number(lastAppliedBounds.width || petLayoutConfig.compactSize),
            height: Number(lastAppliedBounds.height || petLayoutConfig.compactSize),
          };
        }
        return { x: 0, y: 0, width: petLayoutConfig.compactSize, height: petLayoutConfig.compactSize };
      }

      function getPlacementNeed(placement) {
        const value = String(placement || "").toLowerCase();
        if (value === "top" || value === "bottom") {
          return PANEL_HEIGHT + PANEL_GAP;
        }
        return PANEL_WIDTH + PANEL_GAP;
      }

      function chooseControlPlacement() {
        const bounds = getCurrentWindowBounds();
        const area = getScreenWorkArea();
        const petCenterX = Number(bounds.x || 0) + Number(currentAnchorX || petLayoutConfig.compactSize / 2);
        const petCenterY = Number(bounds.y || 0) + Number(currentAnchorY || petLayoutConfig.compactSize / 2);
        const rightSpace = area.right - (petCenterX + PET_RADIUS);
        const leftSpace = (petCenterX - PET_RADIUS) - area.left;
        const topSpace = (petCenterY - PET_RADIUS) - area.top;
        const bottomSpace = area.bottom - (petCenterY + PET_RADIUS);
        const rightNeed = getPlacementNeed("right");
        const leftNeed = getPlacementNeed("left");
        const topNeed = getPlacementNeed("top");
        const bottomNeed = getPlacementNeed("bottom");

        if (rightSpace >= rightNeed) return "right";
        if (leftSpace >= leftNeed) return "left";

        const topOk = topSpace >= topNeed;
        const bottomOk = bottomSpace >= bottomNeed;
        if (topOk || bottomOk) {
          return topSpace >= bottomSpace ? "top" : "bottom";
        }

        const ranked = [
          { placement: "left", space: leftSpace - leftNeed },
          { placement: "top", space: topSpace - topNeed },
          { placement: "bottom", space: bottomSpace - bottomNeed },
          { placement: "right", space: rightSpace - rightNeed },
        ].sort((a, b) => b.space - a.space);
        return ranked[0]?.placement || "right";
      }

      function computeExpandedLayout() {
        const compact = Number(petLayoutConfig.compactSize || 128);
        const placement = controlsPlacementLock || chooseControlPlacement();
        controlsPlacementLock = placement;
        const base = {
          mode: "expanded",
          placement,
          axis: placement === "top" || placement === "bottom" ? "x" : "y",
          width: compact,
          height: compact,
          petCenterX: compact / 2,
          petCenterY: compact / 2,
          panelWidth: PANEL_WIDTH,
          panelHeight: PANEL_HEIGHT,
          controlsLeft: PANEL_MARGIN,
          controlsTop: PANEL_MARGIN,
          controlsEntryX: placement === "left" ? -12 : placement === "right" ? 12 : 0,
          controlsEntryY: placement === "top" ? -12 : placement === "bottom" ? 12 : 0,
        };

        if (placement === "right") {
          base.height = Math.max(compact, PANEL_HEIGHT);
          base.petCenterY = Math.round(base.height / 2);
          base.width = compact + PANEL_WIDTH + PANEL_GAP;
          base.controlsLeft = Math.round(base.petCenterX + PET_RADIUS - 4);
          base.controlsTop = Math.round((base.height - PANEL_HEIGHT) / 2);
          return base;
        }

        if (placement === "left") {
          base.height = Math.max(compact, PANEL_HEIGHT);
          base.petCenterY = Math.round(base.height / 2);
          base.width = compact + PANEL_WIDTH + PANEL_GAP;
          base.petCenterX = compact / 2 + PANEL_WIDTH + PANEL_GAP;
          base.controlsLeft = 0;
          base.controlsTop = Math.round((base.height - PANEL_HEIGHT) / 2);
          return base;
        }

        base.width = Math.max(compact, PANEL_TOP_BOTTOM_WIDTH);
        base.panelWidth = Math.min(base.width - PANEL_MARGIN * 2, PANEL_TOP_BOTTOM_WIDTH);
        base.height = compact + PANEL_HEIGHT + PANEL_GAP;
        base.controlsLeft = Math.round((base.width - base.panelWidth) / 2);
        if (placement === "top") {
          base.petCenterX = Math.round(base.width / 2);
          base.petCenterY = compact / 2 + PANEL_HEIGHT + PANEL_GAP;
          base.controlsTop = 0;
          return base;
        }

        base.petCenterX = Math.round(base.width / 2);
        base.controlsTop = Math.round(base.petCenterY + PET_RADIUS - 2);
        return base;
      }

      function applyLayoutVars(layout) {
        if (!layout || layout.mode !== "expanded") {
          wrap.dataset.controlsAxis = "y";
          wrap.dataset.panelPlacement = "right";
          wrap.style.setProperty("--pet-center-x", `${Math.round(petLayoutConfig.compactSize / 2)}px`);
          wrap.style.setProperty("--pet-center-y", `${Math.round(petLayoutConfig.compactSize / 2)}px`);
          wrap.style.setProperty("--controls-left", `${PANEL_MARGIN}px`);
          wrap.style.setProperty("--controls-top", `${PANEL_MARGIN}px`);
          wrap.style.setProperty("--controls-entry-x", "10px");
          wrap.style.setProperty("--controls-entry-y", "0px");
          wrap.style.setProperty("--panel-width", `${PANEL_WIDTH}px`);
          wrap.style.setProperty("--panel-height", `${PANEL_HEIGHT}px`);
          return;
        }
        wrap.dataset.controlsAxis = String(layout.axis || "y");
        wrap.dataset.panelPlacement = String(layout.placement || "right");
        wrap.style.setProperty("--pet-center-x", `${Math.round(layout.petCenterX)}px`);
        wrap.style.setProperty("--pet-center-y", `${Math.round(layout.petCenterY)}px`);
        wrap.style.setProperty("--controls-left", `${Math.round(layout.controlsLeft)}px`);
        wrap.style.setProperty("--controls-top", `${Math.round(layout.controlsTop)}px`);
        wrap.style.setProperty("--controls-entry-x", `${Math.round(layout.controlsEntryX || 0)}px`);
        wrap.style.setProperty("--controls-entry-y", `${Math.round(layout.controlsEntryY || 0)}px`);
        wrap.style.setProperty("--panel-width", `${Math.round(layout.panelWidth || PANEL_WIDTH)}px`);
        wrap.style.setProperty("--panel-height", `${Math.round(layout.panelHeight || PANEL_HEIGHT)}px`);
      }

      function clearCompactCommitTimer() {
        if (!compactCommitTimer) return;
        clearTimeout(compactCommitTimer);
        compactCommitTimer = 0;
        petDebug("renderer:compact-timer-clear");
      }

      function cancelPanelsVisibleRaf() {
        if (!panelsVisibleRaf) return;
        window.cancelAnimationFrame(panelsVisibleRaf);
        panelsVisibleRaf = 0;
      }

      function requestPanelsVisible() {
        cancelPanelsVisibleRaf();
        panelsVisibleRaf = window.requestAnimationFrame(() => {
          panelsVisibleRaf = 0;
          setPanelsVisible(true);
        });
      }

      function sendLayoutToMainSync(layout, mode) {
        const payload = layout && layout.mode === "expanded"
          ? {
              mode: "expanded",
              width: Math.round(layout.width),
              height: Math.round(layout.height),
              anchorX: Math.round(layout.petCenterX),
              anchorY: Math.round(layout.petCenterY),
            }
          : {
              mode: "compact",
              width: Math.round(petLayoutConfig.compactSize),
              height: Math.round(petLayoutConfig.compactSize),
              anchorX: Math.round(petLayoutConfig.compactSize / 2),
              anchorY: Math.round(petLayoutConfig.compactSize / 2),
            };
        const key = `${payload.mode}|${payload.width}|${payload.height}|${payload.anchorX}|${payload.anchorY}`;
        if (key === lastLayoutKey) {
          const live = getCurrentWindowBounds();
          lastAppliedBounds = {
            x: Number(live.x || 0),
            y: Number(live.y || 0),
            width: Number(live.width || payload.width),
            height: Number(live.height || payload.height),
          };
          currentAnchorX = Number(payload.anchorX || petLayoutConfig.compactSize / 2);
          currentAnchorY = Number(payload.anchorY || petLayoutConfig.compactSize / 2);
          petDebug("renderer:layout-skip-same-key", { key });
          return true;
        }
        lastLayoutKey = key;
        try {
          if (typeof window.petBridge?.applyLayoutSync === "function") {
            const result = window.petBridge.applyLayoutSync(payload);
            if (result && result.ok === false) {
              throw new Error("layout sync failed");
            }
            petDebug("renderer:layout-sync", {
              mode: String(mode || "expanded"),
              width: payload.width,
              height: payload.height,
              anchorX: payload.anchorX,
              anchorY: payload.anchorY,
              applied: result?.applied || null,
            });
            const applied = result?.applied;
            if (applied && Number.isFinite(applied.x) && Number.isFinite(applied.y)) {
              lastAppliedBounds = {
                x: Number(applied.x || 0),
                y: Number(applied.y || 0),
                width: Number(applied.width || payload.width),
                height: Number(applied.height || payload.height),
              };
            }
          } else if (typeof window.petBridge?.setLayout === "function") {
            window.petBridge.setLayout(payload);
            petDebug("renderer:layout-async-fallback", {
              mode: String(mode || "expanded"),
              width: payload.width,
              height: payload.height,
              anchorX: payload.anchorX,
              anchorY: payload.anchorY,
            });
            lastAppliedBounds = {
              x: Number(window.screenX || 0),
              y: Number(window.screenY || 0),
              width: Number(payload.width || petLayoutConfig.compactSize),
              height: Number(payload.height || petLayoutConfig.compactSize),
            };
          }
          currentAnchorX = Number(payload.anchorX || petLayoutConfig.compactSize / 2);
          currentAnchorY = Number(payload.anchorY || petLayoutConfig.compactSize / 2);
          return true;
        } catch {
          lastLayoutKey = "";
          petDebug("renderer:layout-error", {
            mode: payload.mode,
            width: payload.width,
            height: payload.height,
            anchorX: payload.anchorX,
            anchorY: payload.anchorY,
          });
          return false;
        }
      }

      function commitCompactLayout() {
        clearCompactCommitTimer();
        const applied = sendLayoutToMainSync(null, "compact");
        if (!applied) return;
        applyLayoutVars(null);
        visualLayoutMode = "compact";
        petDebug("renderer:compact-commit", {
          desiredHoverActive,
          dragging,
          pointerActive,
        });
      }

      function scheduleCompactLayoutCommit() {
        if (compactCommitTimer) return;
        petDebug("renderer:compact-timer-set", {
          delayMs: PANEL_FADE_MS,
          desiredHoverActive,
          dragging,
          pointerActive,
        });
        compactCommitTimer = window.setTimeout(() => {
          compactCommitTimer = 0;
          if (desiredHoverActive || dragging) {
            petDebug("renderer:compact-timer-abort", {
              desiredHoverActive,
              dragging,
            });
            scheduleLayoutSync(true);
            return;
          }
          petDebug("renderer:compact-timer-fire");
          commitCompactLayout();
        }, PANEL_FADE_MS);
      }

      function syncLayoutNow() {
        const expanded = desiredHoverActive && !dragging;
        if (expanded) {
          clearCompactCommitTimer();
          const layout = computeExpandedLayout();
          const applied = sendLayoutToMainSync(layout, "expanded");
          if (!applied) return;
          applyLayoutVars(layout);
          visualLayoutMode = "expanded";
          petDebug("renderer:expanded-commit", {
            width: layout.width,
            height: layout.height,
            petCenterX: layout.petCenterX,
            petCenterY: layout.petCenterY,
            placement: layout.placement,
            panelWidth: layout.panelWidth,
            panelHeight: layout.panelHeight,
          });
          requestPanelsVisible();
          return;
        }
        cancelPanelsVisibleRaf();
        setPanelsVisible(false);
        if (dragging) {
          clearCompactCommitTimer();
          petDebug("renderer:drag-layout-hold", { visualLayoutMode });
          return;
        }
        if (visualLayoutMode === "compact") {
          commitCompactLayout();
          return;
        }

      function scheduleLayoutSync(force = false) {
        if (force && layoutSyncRaf) {
          cancelAnimationFrame(layoutSyncRaf);
          layoutSyncRaf = 0;
        }
        if (layoutSyncRaf) return;
        layoutSyncRaf = requestAnimationFrame(() => {
          layoutSyncRaf = 0;
          syncLayoutNow();
        });
      }

      function normalizeState(raw) {
        const value = String(raw || "").trim().toLowerCase();
        if (value === "happy" || value === "completed" || value === "resting" || value === "working") return value;
        if (value === "active") return "happy";
        if (value === "idle" || value === "sleep") return "resting";
        if (value === "busy" || value === "focus") return "working";
        return "happy";
      }

      function sourceForState(state) {
        return stateAssets[state] || stateAssets.happy || fallbackIcon || "";
      }

      function truncateText(text, maxLength = 26) {
        const raw = String(text || "").trim();
        if (!raw) return "";
        return raw.length > maxLength ? `${raw.slice(0, Math.max(0, maxLength - 1))}…` : raw;
      }

      function clampUnit(value, min = 0, max = 1) {
        const num = Number(value);
        if (!Number.isFinite(num)) return min;
        return Math.max(min, Math.min(max, num));
      }

      function buildPrimaryLine(payload = {}) {
        const coach = String(payload?.coachLine || "").trim();
        if (coach) return truncateText(coach, 28);
        const workDurationMin = Math.max(0, Number(payload?.workDurationMin || 0));
        if (payload?.state === "working") {
          if (workDurationMin >= 90) return "继续下潜。";
          if (workDurationMin >= 45) return "先别切走。";
          return "我替你守着。";
        }
        if (payload?.state === "completed") {
          return "这一段稳了。";
        }
        if (payload?.state === "resting") {
          return payload?.isLateNight ? "今晚慢一点。" : "先缓一口气。";
        }
        if (payload?.hasMusic) {
          return "让声音先铺开。";
        }
        return "我在。";
      }

      function applyMoodTheme(payload = {}) {
        const emotion = payload?.emotion && typeof payload.emotion === "object" ? payload.emotion : {};
        const mood = String(emotion.mood || "calm").trim() || "calm";
        wrap.dataset.mood = mood;
        const theme = moodThemes[mood] || moodThemes.calm;
        wrap.style.setProperty("--entity-fill", theme.fill);
        wrap.style.setProperty("--entity-accent", theme.accent);
        wrap.style.setProperty("--entity-line", theme.line);
        wrap.style.setProperty("--surface-bg", theme.surface);
        wrap.style.setProperty("--surface-border", theme.line);
      }

      function applyEntityVisual(payload = {}) {
        const emotion = payload?.emotion && typeof payload.emotion === "object" ? payload.emotion : {};
        const state = normalizeState(payload?.state || currentState);
        const focus = clampUnit(Number(emotion.focus || 0) / 100);
        const energy = clampUnit(Number(emotion.energy || 0) / 100);
        const tension = clampUnit(Number(emotion.tension || 0) / 100);
        const valence = clampUnit(Number(emotion.valence || 0) / 100);

        let symbolWidth = 12;
        let symbolHeight = 58;
        let symbolRadius = "999px";
        let rotate = 0;
        let shiftY = 0;
        let symbolOpacity = 0.92;
        let symbolSlitWidth = 18;
        let symbolSlitOpacity = 0.28;
        let shardWidth = 14;
        let shardHeight = 1.5;
        let shardX = -10;
        let shardY = -12;
        let shardRotate = -28;
        let shardOpacity = 0.48;
        let shardDriftX = 2;
        let shardDriftY = -2;
        let shardDriftRotate = 10;
        let echoX = 18;
        let echoY = -18;
        let echoWidth = 20;
        let echoHeight = 1.5;
        let echoDotSize = 4;
        let echoRotate = -14;
        let echoOpacity = 0.54;
        let echoDriftX = 3;
        let echoDriftY = -4;
        let echoDriftRotate = 8;
        let glyphDuration = 8.8;
        let echoDuration = 6.8;
        let shardDuration = 9.8;
        let glyphDriftX = 0.7;
        let glyphDriftY = 3;
        let glyphTurn = 1.1;

        if (state === "working") {
          symbolWidth = 10.5;
          symbolHeight = 62 + focus * 8;
          rotate = -6 + energy * 3;
          shiftY = 0.5;
          symbolOpacity = 0.98;
          symbolSlitWidth = 20;
          symbolSlitOpacity = 0.4;
          shardWidth = 18;
          shardX = -9;
          shardY = -18 - tension * 3;
          shardRotate = -34 + energy * 8;
          shardOpacity = 0.52;
          shardDriftX = 3;
          shardDriftY = -4;
          shardDriftRotate = 12;
          echoX = 15 + energy * 4;
          echoY = -22 - focus * 4;
          echoWidth = 14;
          echoHeight = 1.25;
          echoDotSize = 3.6;
          echoRotate = -24;
          echoOpacity = 0.46 + focus * 0.14;
          echoDriftX = 4;
          echoDriftY = -6;
          echoDriftRotate = 12;
          glyphDuration = 6.9 - energy * 0.4;
          echoDuration = 5.4 - energy * 0.2;
          shardDuration = 7.4 - energy * 0.3;
          glyphDriftX = 1;
          glyphDriftY = 4.4 + tension;
          glyphTurn = 1.6;
        } else if (state === "completed") {
          symbolWidth = 16;
          symbolHeight = 50;
          rotate = 7;
          symbolOpacity = 1;
          symbolSlitWidth = 16;
          symbolSlitOpacity = 0.22;
          shardWidth = 12;
          shardX = -13;
          shardY = -6;
          shardRotate = -16;
          shardOpacity = 0.58;
          echoX = 22;
          echoY = -10;
          echoWidth = 24;
          echoHeight = 1.6;
          echoDotSize = 4;
          echoRotate = -4;
          echoOpacity = 0.72;
          echoDriftX = 3;
          echoDriftY = -3;
          echoDriftRotate = 6;
          glyphDuration = 7.4;
          echoDuration = 6.1;
          shardDuration = 8.2;
          glyphDriftX = 0.6;
          glyphDriftY = 2.6;
          glyphTurn = 0.8;
        } else if (state === "resting") {
          symbolWidth = payload?.isLateNight ? 11 : 13;
          symbolHeight = payload?.isLateNight ? 50 : 54;
          rotate = payload?.isLateNight ? -10 : -4;
          shiftY = payload?.isLateNight ? 1.5 : 0.5;
          symbolOpacity = payload?.isLateNight ? 0.8 : 0.88;
          symbolSlitWidth = payload?.isLateNight ? 14 : 16;
          symbolSlitOpacity = payload?.isLateNight ? 0.18 : 0.24;
          shardWidth = payload?.isLateNight ? 10 : 12;
          shardX = -9;
          shardY = payload?.isLateNight ? -8 : -10;
          shardRotate = payload?.isLateNight ? -38 : -24;
          shardOpacity = payload?.isLateNight ? 0.34 : 0.4;
          shardDriftX = 2;
          shardDriftY = -2;
          shardDriftRotate = 8;
          echoX = 14;
          echoY = payload?.isLateNight ? -16 : -14;
          echoWidth = payload?.isLateNight ? 12 : 15;
          echoHeight = 1.2;
          echoDotSize = payload?.isLateNight ? 3.2 : 3.6;
          echoRotate = payload?.isLateNight ? -20 : -12;
          echoOpacity = payload?.isLateNight ? 0.42 : 0.5;
          echoDriftX = payload?.isLateNight ? 3 : 4;
          echoDriftY = payload?.isLateNight ? -3 : -4;
          echoDriftRotate = 6;
          glyphDuration = payload?.isLateNight ? 10.4 : 9.2;
          echoDuration = payload?.isLateNight ? 8.1 : 7.2;
          shardDuration = payload?.isLateNight ? 11.4 : 10.2;
          glyphDriftX = 0.5;
          glyphDriftY = payload?.isLateNight ? 2.2 : 2.8;
          glyphTurn = payload?.isLateNight ? 0.8 : 1;
        } else {
          symbolWidth = 12 + valence * 2;
          symbolHeight = 56 + energy * 2;
          rotate = payload?.hasMusic ? 4 : valence * 1.6 - tension * 1.2;
          symbolOpacity = 0.9 + valence * 0.08;
          symbolSlitWidth = payload?.hasMusic ? 20 : 18;
          symbolSlitOpacity = payload?.hasMusic ? 0.34 : 0.28;
          shardWidth = payload?.hasMusic ? 16 : 14;
          shardX = payload?.hasMusic ? -7 : -10;
          shardY = payload?.hasMusic ? -14 : -12;
          shardRotate = payload?.hasMusic ? -18 : -28;
          shardOpacity = 0.44 + valence * 0.08;
          echoX = 18;
          echoY = -18;
          echoWidth = payload?.hasMusic ? 24 : 20;
          echoHeight = payload?.hasMusic ? 1.6 : 1.5;
          echoDotSize = payload?.hasMusic ? 4.2 : 4;
          echoRotate = payload?.hasMusic ? -8 : -14;
          echoOpacity = 0.5 + valence * 0.12;
          echoDriftX = payload?.hasMusic ? 5 : 3;
          echoDriftY = payload?.hasMusic ? -6 : -4;
          echoDriftRotate = payload?.hasMusic ? 10 : 8;
          glyphDuration = payload?.hasMusic ? 7.2 : 8.8;
          echoDuration = payload?.hasMusic ? 5.8 : 6.8;
          shardDuration = payload?.hasMusic ? 8.1 : 9.8;
          glyphDriftX = payload?.hasMusic ? 1 : 0.7;
          glyphDriftY = payload?.hasMusic ? 3.8 : 3;
          glyphTurn = payload?.hasMusic ? 1.4 : 1.1;
        }

        if (payload?.hasMusic) {
          echoX += 2;
          echoWidth += 2;
          echoDotSize += 0.2;
          symbolOpacity = Math.min(1, symbolOpacity + 0.03);
          echoOpacity = Math.min(0.76, echoOpacity + 0.12);
        }

        if (payload?.coachLine) {
          shardOpacity = Math.min(1, shardOpacity + 0.08);
          echoWidth += 1;
          echoDotSize += 0.3;
          echoY -= 2;
          echoOpacity = Math.min(0.82, echoOpacity + 0.08);
        }

        wrap.style.setProperty("--symbol-width", `${symbolWidth.toFixed(1)}px`);
        wrap.style.setProperty("--symbol-height", `${symbolHeight.toFixed(1)}px`);
        wrap.style.setProperty("--symbol-radius", symbolRadius);
        wrap.style.setProperty("--symbol-rotate", `${rotate.toFixed(1)}deg`);
        wrap.style.setProperty("--symbol-shift-y", `${shiftY.toFixed(1)}px`);
        wrap.style.setProperty("--symbol-opacity", symbolOpacity.toFixed(3));
        wrap.style.setProperty("--symbol-slit-width", `${symbolSlitWidth.toFixed(1)}px`);
        wrap.style.setProperty("--symbol-slit-opacity", symbolSlitOpacity.toFixed(3));
        wrap.style.setProperty("--shard-width", `${shardWidth.toFixed(1)}px`);
        wrap.style.setProperty("--shard-height", `${shardHeight.toFixed(1)}px`);
        wrap.style.setProperty("--shard-x", `${shardX.toFixed(1)}px`);
        wrap.style.setProperty("--shard-y", `${shardY.toFixed(1)}px`);
        wrap.style.setProperty("--shard-rotate", `${shardRotate.toFixed(1)}deg`);
        wrap.style.setProperty("--shard-opacity", shardOpacity.toFixed(3));
        wrap.style.setProperty("--shard-drift-x", `${shardDriftX.toFixed(1)}px`);
        wrap.style.setProperty("--shard-drift-y", `${shardDriftY.toFixed(1)}px`);
        wrap.style.setProperty("--shard-drift-rotate", `${shardDriftRotate.toFixed(1)}deg`);
        wrap.style.setProperty("--echo-x", `${echoX.toFixed(1)}px`);
        wrap.style.setProperty("--echo-y", `${echoY.toFixed(1)}px`);
        wrap.style.setProperty("--echo-width", `${echoWidth.toFixed(1)}px`);
        wrap.style.setProperty("--echo-height", `${echoHeight.toFixed(1)}px`);
        wrap.style.setProperty("--echo-dot-size", `${echoDotSize.toFixed(1)}px`);
        wrap.style.setProperty("--echo-rotate", `${echoRotate.toFixed(1)}deg`);
        wrap.style.setProperty("--echo-opacity", echoOpacity.toFixed(3));
        wrap.style.setProperty("--echo-drift-x", `${echoDriftX.toFixed(1)}px`);
        wrap.style.setProperty("--echo-drift-y", `${echoDriftY.toFixed(1)}px`);
        wrap.style.setProperty("--echo-drift-rotate", `${echoDriftRotate.toFixed(1)}deg`);
        wrap.style.setProperty("--glyph-duration", `${glyphDuration.toFixed(2)}s`);
        wrap.style.setProperty("--echo-duration", `${echoDuration.toFixed(2)}s`);
        wrap.style.setProperty("--shard-duration", `${shardDuration.toFixed(2)}s`);
        wrap.style.setProperty("--glyph-drift-x", `${glyphDriftX.toFixed(1)}px`);
        wrap.style.setProperty("--glyph-drift-y", `${glyphDriftY.toFixed(1)}px`);
        wrap.style.setProperty("--glyph-turn", `${glyphTurn.toFixed(1)}deg`);
        wrap.dataset.state = state;
        wrap.dataset.music = payload?.hasMusic ? "1" : "0";
        wrap.dataset.coach = payload?.coachLine ? "1" : "0";
      }

      function renderPanelContent(payload = {}) {
        speechLine.textContent = buildPrimaryLine(payload);
      }

      function setHoverActive(active) {
        const next = Boolean(active);
        if (desiredHoverActive === next) return;
        petDebug("renderer:hover-active", {
          prev: desiredHoverActive,
          next,
          pointerActive,
          dragging,
        });
        desiredHoverActive = next;
        if (!next) {
          controlsPlacementLock = "";
        }
        scheduleLayoutSync();
      }

      function setPanelsVisible(visible) {
        const next = Boolean(visible);
        if (wrap.classList.contains("panels-visible") === next) return;
        petDebug("renderer:panels-visible", { next });
        wrap.classList.toggle("panels-visible", next);
      }

      function beginPendingPlayVisual(intentId, expectedIsPlaying) {
        pendingPlayVisual = {
          intentId: Number(intentId || 0),
          expectedIsPlaying: Boolean(expectedIsPlaying),
          expiresAt: Date.now() + PLAY_VISUAL_STALE_GUARD_MS,
        };
      }

      function clearPendingPlayVisual(reason = "") {
        if (!pendingPlayVisual) return;
        petDebug("renderer:media-play-pending-clear", {
          intentId: Number(pendingPlayVisual.intentId || 0),
          reason: String(reason || ""),
        });
        pendingPlayVisual = null;
      }

      function resolvePlayVisualState(rawIsPlaying) {
        const incoming = Boolean(rawIsPlaying);
        if (!pendingPlayVisual) return incoming;
        const now = Date.now();
        if (now > Number(pendingPlayVisual.expiresAt || 0)) {
          clearPendingPlayVisual("expired");
          return incoming;
        }
        if (incoming === Boolean(pendingPlayVisual.expectedIsPlaying)) {
          clearPendingPlayVisual("ack");
          return incoming;
        }
        return Boolean(pendingPlayVisual.expectedIsPlaying);
      }

      function setMusicPanel(payload) {
        const media = payload?.media && typeof payload.media === "object" ? payload.media : null;
        const musicNames = Array.isArray(payload?.musicDisplayNames)
          ? payload.musicDisplayNames.filter((item) => typeof item === "string" && item.trim())
          : [];
        const hasMediaDetail = !!(media && (media.title || media.artist || media.app));
        const hasMusic = Boolean(payload?.hasMusic) || musicNames.length > 0 || hasMediaDetail;
        controlRail.classList.add("hidden");
        mediaRow.classList.add("hidden");
        if (!hasMusic) {
          latestMedia = null;
          controlsPlacementLock = "";
          clearPendingPlayVisual("no_music");
          btnPrev.disabled = true;
          btnPlay.disabled = true;
          btnNext.disabled = true;
          setButtonIcon(btnPlay, "play");
          mediaTitle.textContent = "";
          scheduleLayoutSync();
          return;
        }

        const visualIsPlaying = resolvePlayVisualState(media?.isPlaying);
        latestMedia = media && typeof media === "object" ? { ...media, isPlaying: visualIsPlaying } : { isPlaying: visualIsPlaying };

        const mediaControllable = Boolean(media && media.available && (media.canPlay || media.canPause || media.canNext || media.canPrev));
        btnPrev.disabled = !hasMusic || (mediaControllable && !media?.canPrev);
        btnNext.disabled = !hasMusic || (mediaControllable && !media?.canNext);
        btnPlay.disabled = !hasMusic || (mediaControllable && !(media?.canPlay || media?.canPause));
        setButtonIcon(btnPlay, visualIsPlaying ? "pause" : "play");

        scheduleLayoutSync();
      }

      function applyState(payload, force = false) {
        const nextPayload = payload && typeof payload === "object" ? { ...payload } : {};
        const nextState = normalizeState(nextPayload?.state || currentState);
        const sameState = nextState === currentState;
        lastPayload = {
          ...lastPayload,
          ...nextPayload,
          state: nextState,
        };

        if (!sameState || force) {
          currentState = nextState;
          pet.dataset.state = nextState;
          const src = sourceForState(nextState);
          if (src && pet.src !== src) {
            pet.src = src;
          }
        }

        applyMoodTheme(lastPayload);
        applyEntityVisual(lastPayload);
        renderPanelContent(lastPayload);
        setMusicPanel(lastPayload);
        scheduleLayoutSync();
      }

      function applyConfig(config, force = false) {
        if (config && typeof config === "object") {
          if (config.icon) fallbackIcon = String(config.icon);
          if (Number.isFinite(Number(config.compactSize))) {
            petLayoutConfig.compactSize = Math.max(96, Math.round(Number(config.compactSize)));
            lastLayoutKey = "";
            currentAnchorX = petLayoutConfig.compactSize / 2;
            currentAnchorY = petLayoutConfig.compactSize / 2;
          }
          if (config.stateAssets && typeof config.stateAssets === "object") {
            stateAssets = { ...config.stateAssets };
          }
          if (typeof config.clickThroughEnabled === "boolean") {
            clickThroughEnabled = config.clickThroughEnabled;
            clearDeactivateTimer();
            setPointerActive(false);
          }
        }
        applyState({ ...lastPayload, state: config?.state || currentState }, force);
        scheduleLayoutSync(true);
      }

      function isInsidePet(clientX, clientY) {
        const rect = pet.getBoundingClientRect();
        const pad = 4;
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function isInsideRect(el, clientX, clientY, pad = 2) {
        if (!wrap.classList.contains("panels-visible")) return false;
        if (!el || el.classList.contains("hidden")) return false;
        const rect = el.getBoundingClientRect();
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function mergeRect(base, next) {
        if (!base) return next ? { ...next } : null;
        if (!next) return { ...base };
        return {
          left: Math.min(base.left, next.left),
          top: Math.min(base.top, next.top),
          right: Math.max(base.right, next.right),
          bottom: Math.max(base.bottom, next.bottom),
        };
      }

      function buildInteractiveRect() {
        let rect = null;
        const petRect = pet?.getBoundingClientRect?.();
        if (petRect) {
          rect = mergeRect(rect, petRect);
        }
        if (wrap.classList.contains("panels-visible")) {
          if (statusPanel) {
            rect = mergeRect(rect, statusPanel.getBoundingClientRect());
          }
        }
        return rect;
      }

      function isInsideInteractive(clientX, clientY) {
        if (isInsidePet(clientX, clientY)) return true;
        if (isInsideRect(statusPanel, clientX, clientY, 3)) return true;
        if (desiredHoverActive || wrap.classList.contains("panels-visible")) {
          const rect = buildInteractiveRect();
          if (!rect) return false;
          if (
            clientX >= rect.left - HOVER_SAFE_ZONE_PADDING &&
            clientX <= rect.right + HOVER_SAFE_ZONE_PADDING &&
            clientY >= rect.top - HOVER_SAFE_ZONE_PADDING &&
            clientY <= rect.bottom + HOVER_SAFE_ZONE_PADDING
          ) {
            return true;
          }
        }
        return false;
      }

      function clearDeactivateTimer() {
        if (!deactivateTimer) return;
        clearTimeout(deactivateTimer);
        deactivateTimer = null;
      }

      function schedulePointerInactive() {
        if (dragging) return;
        clearDeactivateTimer();
        petDebug("renderer:pointer-inactive-scheduled", {
          delayMs: DEACTIVATE_DELAY_MS,
          pointerActive,
        });
        deactivateTimer = setTimeout(() => {
          deactivateTimer = null;
          const now = Date.now();
          const recentlyInside = now - Number(lastInsideInteractiveAt || 0) < DEACTIVATE_DELAY_MS;
          const holdActive = pointerActive && (now - Number(pointerActivatedAt || 0) < POINTER_ACTIVE_HOLD_MS);
          if (recentlyInside || holdActive) {
            petDebug("renderer:pointer-inactive-delayed", {
              recentlyInside,
              holdActive,
              pointerActive,
            });
            schedulePointerInactive();
            return;
          }
          petDebug("renderer:pointer-inactive-commit", { pointerActive });
          setPointerActive(false);
        }, DEACTIVATE_DELAY_MS);
      }

      function syncPointerByPoint(clientX, clientY) {
        if (isInsideInteractive(clientX, clientY)) {
          lastInsideInteractiveAt = Date.now();
          clearDeactivateTimer();
          setPointerActive(true);
          return;
        }
        schedulePointerInactive();
      }

      function setPointerActive(next) {
        const active = Boolean(next);
        const now = Date.now();
        const canExpand = active && !dragging && now >= Number(suppressExpandUntil || 0);
        if (pointerActive === active) {
          const nextHover = canExpand;
          if (desiredHoverActive !== nextHover) {
            setHoverActive(nextHover);
          }
          return;
        }
        const prev = pointerActive;
        pointerActive = active;
        if (active) {
          pointerActivatedAt = Date.now();
        }
        petDebug("renderer:pointer-active", {
          prev,
          next: active,
          canExpand,
          dragging,
          clickThroughEnabled,
        });
        setHoverActive(canExpand);
        if (clickThroughEnabled) {
          window.petBridge?.setPointerActive(active);
        }
      }

      function scheduleHoverSync(clientX, clientY) {
        pendingHoverPoint = { x: clientX, y: clientY };
        if (hoverSyncRaf) return;
        hoverSyncRaf = window.requestAnimationFrame(() => {
          hoverSyncRaf = 0;
          const point = pendingHoverPoint;
          pendingHoverPoint = null;
          if (!point || dragging) return;
          syncPointerByPoint(point.x, point.y);
        });
      }

      function forceCollapsePanels(reason = "") {
        desiredHoverActive = false;
        controlsPlacementLock = "";
        lastInsideInteractiveAt = 0;
        clearDeactivateTimer();
        cancelPanelsVisibleRaf();
        setPanelsVisible(false);
        petDebug("renderer:force-collapse", {
          reason: String(reason || ""),
          pointerActive,
          dragging,
        });
        if (clickThroughEnabled) {
          pointerActive = false;
          window.petBridge?.setPointerActive(false);
        }
        scheduleLayoutSync(true);
      }

      async function runMediaAction(action, payload = {}) {
        try {
          const result = await window.petBridge?.mediaControl?.(action, payload);
          if (result?.state) {
            applyState(result.state, true);
          }
          return result || { ok: false, detail: "empty_result" };
        } catch {
          // ignore control errors in UI
          return { ok: false, detail: "ui_bridge_error" };
        }
      }

      function setOptimisticPlayVisual(isPlaying, intentId = 0) {
        beginPendingPlayVisual(intentId, isPlaying);
        if (!latestMedia || typeof latestMedia !== "object") {
          latestMedia = {};
        }
        latestMedia = {
          ...latestMedia,
          isPlaying: Boolean(isPlaying),
        };
        setButtonIcon(btnPlay, latestMedia.isPlaying ? "pause" : "play");
      }

      btnPrev.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("previous");
      });
      btnPlay.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const wasPlaying = Boolean(latestMedia?.isPlaying);
        const nextPlaying = !wasPlaying;
        const previousMedia = latestMedia && typeof latestMedia === "object" ? { ...latestMedia } : null;
        const intentId = ++mediaControlIntentSeq;
        const action = wasPlaying ? "pause" : "play";
        const canDirect = wasPlaying ? latestMedia?.canPause : latestMedia?.canPlay;
        setOptimisticPlayVisual(nextPlaying, intentId);
        petDebug("renderer:media-play-optimistic", {
          intentId,
          action: canDirect ? action : "play_pause",
          wasPlaying,
          nextPlaying,
        });
        void (async () => {
          const result = await runMediaAction(canDirect ? action : "play_pause");
          if (intentId !== mediaControlIntentSeq) return;
          if (result?.ok) return;
          clearPendingPlayVisual("rollback");
          latestMedia = previousMedia;
          setButtonIcon(btnPlay, previousMedia?.isPlaying ? "pause" : "play");
          petDebug("renderer:media-play-rollback", {
            intentId,
            detail: String(result?.detail || ""),
          });
        })();
      });
      btnNext.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("next");
      });

      [pet, statusPanel].forEach((el) => {
        el?.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          window.petBridge?.openMenu({
            screenX: event.screenX,
            screenY: event.screenY,
          });
        });

        el?.addEventListener("mouseup", (event) => {
          if (event.button !== 2) return;
          event.preventDefault();
          window.petBridge?.openMenu({
            screenX: event.screenX,
            screenY: event.screenY,
          });
        });
      });

      pet.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || !event.isPrimary) return;
        event.preventDefault();
        clearDeactivateTimer();
        setPointerActive(true);
        dragging = true;
        petDebug("renderer:drag-start", {
          pointerId: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY,
          screenX: event.screenX,
          screenY: event.screenY,
        });
        wrap.classList.add("dragging-panels-hidden");
        moved = false;
        setHoverActive(false);
        scheduleLayoutSync(true);
        activePointerId = event.pointerId;
        startX = event.screenX;
        startY = event.screenY;
        if (typeof pet.setPointerCapture === "function") {
          try {
            pet.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        const localX = event.clientX;
        const localY = event.clientY;
        pet.classList.add("dragging");
        pet.classList.add("pressing");
        window.petBridge?.dragStart({
          screenX: event.screenX,
          screenY: event.screenY,
          localX,
          localY,
        });
      });

      pet.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        if (!event.isPrimary || event.pointerId !== activePointerId) return;
        const dx = Math.abs(event.screenX - startX);
        const dy = Math.abs(event.screenY - startY);
        if (dx > 2 || dy > 2) moved = true;
        window.petBridge?.dragMove({ screenX: event.screenX, screenY: event.screenY });
      });

      function finishPointerDrag(event, cancelled = false) {
        if (!dragging) return;
        if (event && event.pointerId !== undefined && event.pointerId !== activePointerId) return;
        const wasMoved = moved;
        dragging = false;
        petDebug("renderer:drag-end", {
          cancelled: Boolean(cancelled),
          wasMoved: Boolean(wasMoved),
          pointerId: activePointerId,
        });
        if (wasMoved) {
          suppressExpandUntil = Date.now() + DRAG_END_REOPEN_GUARD_MS;
          petDebug("renderer:drag-end-suppress-expand", {
            until: suppressExpandUntil,
            guardMs: DRAG_END_REOPEN_GUARD_MS,
          });
          setHoverActive(false);
        }
        wrap.classList.remove("dragging-panels-hidden");
        moved = false;
        scheduleLayoutSync(true);
        const pointerId = activePointerId;
        activePointerId = null;
        if (pointerId !== null && typeof pet.releasePointerCapture === "function") {
          try {
            if (typeof pet.hasPointerCapture !== "function" || pet.hasPointerCapture(pointerId)) {
              pet.releasePointerCapture(pointerId);
            }
          } catch {
            // ignore release capture failures
          }
        }
        pet.classList.remove("dragging");
        pet.classList.remove("pressing");
        window.petBridge?.dragEnd();
        if (!cancelled && !wasMoved && event?.button === 0) {
          window.petBridge?.openChat();
        }
        if (event && !wasMoved) {
          syncPointerByPoint(event.clientX, event.clientY);
        } else {
          lastAppliedBounds = null;
          schedulePointerInactive();
        }
      }

      pet.addEventListener("pointerup", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, false);
      });

      pet.addEventListener("pointercancel", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, true);
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) {
          scheduleHoverSync(event.clientX, event.clientY);
        }
      });

      pet.addEventListener("dblclick", (event) => {
        event.preventDefault();
        window.petBridge?.openChat();
      });

      [pet, statusPanel].forEach((el) => {
        el?.addEventListener("mouseenter", (event) => {
          if (dragging) return;
          syncPointerByPoint(event.clientX, event.clientY);
        });
      });

      window.addEventListener("mouseleave", () => {
        if (!dragging) schedulePointerInactive();
      });

      const offState = window.petBridge?.onState?.((payload) => {
        applyState(payload || {});
      });
      const offConfig = window.petBridge?.onConfig?.((payload) => {
        applyConfig(payload || {});
      });
      const offForceCollapse = window.petBridge?.onForceCollapse?.((payload) => {
        petDebug("renderer:force-collapse-recv", {
          reason: String(payload?.reason || ""),
          ts: Number(payload?.ts || 0),
        });
        forceCollapsePanels(String(payload?.reason || ""));
      });

      window.petBridge?.getConfig?.().then((config) => {
        applyConfig(config || {}, true);
      }).catch(() => {
        if (fallbackIcon) pet.src = fallbackIcon;
      });

      if (fallbackIcon && !pet.getAttribute("src")) {
        pet.src = fallbackIcon;
      }

      window.addEventListener("beforeunload", () => {
        clearDeactivateTimer();
        clearCompactCommitTimer();
        cancelPanelsVisibleRaf();
        if (hoverSyncRaf) window.cancelAnimationFrame(hoverSyncRaf);
        if (layoutSyncRaf) window.cancelAnimationFrame(layoutSyncRaf);
        if (typeof offState === "function") offState();
        if (typeof offConfig === "function") offConfig();
        if (typeof offForceCollapse === "function") offForceCollapse();
      });
    </script>
  </body>
</html>
