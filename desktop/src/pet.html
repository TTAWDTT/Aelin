<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
        font-family: "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      }
      #petWrap {
        position: relative;
        width: 100%;
        height: 100%;
        --pet-center-x: 64px;
        --pet-center-y: 50%;
        --controls-left: 6px;
        --controls-top: 6px;
        --controls-entry-x: 8px;
        --controls-entry-y: 0px;
        --panel-width: 248px;
        --panel-height: 64px;
        --control-size: 22px;
        --control-gap: 4px;
        --surface-bg: rgba(244, 242, 236, 0.94);
        --surface-border: rgba(37, 34, 30, 0.12);
        --surface-muted: rgba(37, 34, 30, 0.05);
        --surface-active: rgba(37, 34, 30, 0.08);
        --ink-strong: #1f1c18;
        --ink-soft: #7a746b;
        --entity-fill: #181614;
        --entity-line: rgba(37, 34, 30, 0.16);
        --entity-accent: #6d7d89;
        --card-width: 60px;
        --card-height: 84px;
        --card-radius: 13px;
        --card-rotate: -1.4deg;
        --card-shift-y: 0px;
        --card-opacity: 0.98;
        --card-bg: rgba(251, 248, 241, 0.96);
        --card-border: rgba(37, 34, 30, 0.16);
        --card-inline: rgba(255, 255, 255, 0.58);
        --card-shadow-opacity: 0.08;
        --card-shadow-x: 0px;
        --card-shadow-y: 16px;
        --card-shadow-blur: 28px;
        --card-shadow-spread: -12px;
        --card-ambient-opacity: 0.12;
        --card-tilt-x: 2deg;
        --card-tilt-y: -5deg;
        --card-glint-angle: -24deg;
        --card-glint-opacity: 0.18;
        --card-glint-shift-x: -6px;
        --card-glint-shift-y: -10px;
        --card-glint-scale: 1.04;
        --card-rank-size: 11px;
        --card-suit-size: 10px;
        --card-center-size: 23px;
        --card-suit-color: #1f1c18;
        --card-ink: #1d1c19;
        --card-center-rotate: 0deg;
        --card-center-scale: 1;
        --card-center-shadow: 0 10px 14px rgba(255, 255, 255, 0.22);
        --card-art-width: 50px;
        --card-art-height: 70px;
        --card-art-shift-x: 7px;
        --card-art-shift-y: 0px;
        --card-art-rotate: 0deg;
        --card-art-scale-x: 1.04;
        --card-art-scale-y: 1;
        --card-art-clip-x: 84%;
        --card-art-clip-y: 49%;
        --card-art-clip-rx: 44%;
        --card-art-clip-ry: 57%;
        --card-art-dot-gap: 5.8px;
        --card-art-dot-size: 1.2px;
        --card-art-dot-opacity: 0.72;
        --card-art-rings-gap: 12.5px;
        --card-art-rings-opacity: 0.56;
        --card-art-rings-rotate: -8deg;
        --card-art-rings-shift-x: 0px;
        --card-art-rings-shift-y: 0px;
        --card-art-rings-scale: 1;
        --card-art-rings-crop-x: 83%;
        --card-art-rings-crop-y: 83%;
        --card-art-rings-crop-rx: 43%;
        --card-art-rings-crop-ry: 24%;
        --px: 0;
        --py: 0;
        --card-motion-x: 0px;
        --card-motion-y: 0px;
        --card-motion-scale: 1;
        --card-motion-rotate: 0deg;
        --card-motion-tilt-x: 0deg;
        --card-motion-tilt-y: 0deg;
        --card-motion-art-shift-x: 0px;
        --card-motion-art-shift-y: 0px;
        --card-motion-art-rotate: 0deg;
        --card-motion-art-clip-x: 0%;
        --card-motion-art-clip-y: 0%;
        --card-motion-rings-shift-x: 0px;
        --card-motion-rings-shift-y: 0px;
        --card-motion-rings-rotate: 0deg;
        --card-motion-rings-scale: 0;
        --card-motion-rings-opacity: 0;
        --card-motion-dots-opacity: 0;
        --echo-x: -6px;
        --echo-y: 5px;
        --echo-width: 60px;
        --echo-height: 84px;
        --echo-rotate: 2.2deg;
        --echo-opacity: 0.18;
        --echo-scale: 0.96;
        --echo-blur: 0px;
        --echo-shadow-opacity: 0.08;
        --echo-drift-x: 1px;
        --echo-drift-y: 1px;
        --echo-drift-rotate: 1.4deg;
        --glyph-duration: 9.8s;
        --echo-duration: 8.4s;
        --glint-duration: 8.8s;
        --glyph-drift-x: 0.5px;
        --glyph-drift-y: 2px;
        --glyph-turn: 0.8deg;
        pointer-events: auto;
      }
      #statusPanel {
        position: absolute;
        left: var(--controls-left);
        top: var(--controls-top);
        box-sizing: border-box;
        width: min(var(--panel-width), calc(100% - 12px));
        min-height: var(--panel-height);
        padding: 8px 10px 8px 14px;
        border-radius: 0;
        border: none;
        background: linear-gradient(90deg, var(--surface-bg) 0%, rgba(244, 242, 236, 0.72) 62%, rgba(244, 242, 236, 0) 100%);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        opacity: 0;
        pointer-events: none;
        transform: translate3d(var(--controls-entry-x), var(--controls-entry-y), 0);
        transform-origin: center;
        will-change: opacity, transform;
        backface-visibility: hidden;
        transition: opacity 150ms ease, transform 170ms ease, border-color 170ms ease, background 170ms ease;
      }
      #statusPanel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 9px;
        bottom: 9px;
        width: 1px;
        background: var(--surface-border);
        opacity: 0.86;
      }
      .panels-visible #statusPanel {
        opacity: 1;
        transform: translate3d(0, 0, 0);
        pointer-events: auto;
      }
      #petWrap.dragging-panels-hidden #statusPanel {
        opacity: 0 !important;
        pointer-events: none !important;
        transform: translate3d(var(--controls-entry-x), var(--controls-entry-y), 0) !important;
      }
      #speechLine {
        color: var(--ink-strong);
        width: 100%;
        font-size: 11.5px;
        line-height: 1.46;
        font-weight: 500;
        min-height: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        white-space: normal;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.04em;
        word-break: break-word;
        text-wrap: pretty;
      }
      #mediaRow {
        display: none;
      }
      #mediaTitle {
        display: none;
      }
      #petShell {
        position: absolute;
        left: var(--pet-center-x);
        top: var(--pet-center-y);
        transform: translate(-50%, -50%);
        will-change: transform;
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
      }
      #petFrame {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #petGlyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      #petCard,
      #petEcho {
        position: absolute;
        transition:
          transform 240ms ease,
          box-shadow 260ms ease,
          filter 260ms ease,
          background 220ms ease,
          border-color 220ms ease,
          color 220ms ease,
          font-size 220ms ease,
          width 220ms ease,
          height 220ms ease,
          opacity 220ms ease;
      }
      #petCard {
        position: relative;
        width: var(--card-width);
        height: var(--card-height);
        border-radius: var(--card-radius);
        border: none;
        background: rgba(255, 255, 255, 0.995);
        box-shadow:
          calc(var(--px) * -10px) calc(16px + (var(--py) * 8px)) 30px -14px rgba(18, 17, 16, var(--card-shadow-opacity)),
          0 1px 0 rgba(255, 255, 255, 0.9);
        opacity: var(--card-opacity);
        overflow: hidden;
        transform-origin: center center;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transform:
          perspective(960px)
          translate3d(calc(var(--px) * 1.2px), calc(var(--card-shift-y) + (var(--py) * -1.2px)), 0)
          rotateX(calc((var(--py) * -24deg) + var(--card-tilt-x)))
          rotateY(calc((var(--px) * 28deg) + var(--card-tilt-y)))
          rotate(calc(var(--card-rotate) + (var(--px) * 5.2deg)));
        will-change: transform, box-shadow;
      }
      #petCard::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1.35px solid rgba(30, 28, 26, 0.88);
        opacity: 1;
      }
      #petCard::after {
        display: none;
      }
      .card-corner {
        position: absolute;
        display: grid;
        gap: 1px;
        justify-items: start;
        color: var(--card-suit-color);
        line-height: 1;
        letter-spacing: 0.02em;
        font-family: "Cascadia Mono", "JetBrains Mono", "IBM Plex Mono", Consolas, monospace;
      }
      .card-corner.top {
        left: 9px;
        top: 9px;
      }
      .card-corner.bottom {
        right: 9px;
        bottom: 9px;
        transform: rotate(180deg);
        justify-items: end;
      }
      .card-rank {
        font-size: var(--card-rank-size);
        font-weight: 600;
      }
      .card-suit {
        font-size: var(--card-suit-size);
      }
      #cardSuitCenter {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--card-art-width);
        height: var(--card-art-height);
        transform: translate(calc(-50% + var(--card-art-shift-x)), calc(-50% + var(--card-art-shift-y)));
        font-size: 0;
        line-height: 0;
        color: transparent;
        opacity: 1;
        pointer-events: none;
        transition: transform 140ms ease-out;
      }
      #cardArtwork {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        shape-rendering: geometricPrecision;
        text-rendering: geometricPrecision;
      }
      .art-front-dot-bg {
        fill: var(--card-ink);
      }
      .art-front-dot-fg {
        fill: rgba(255, 255, 255, 0.9);
      }
      .art-depth-dot-bg {
        fill: rgba(35, 32, 29, 0.28);
      }
      .art-depth-dot-fg {
        fill: rgba(26, 24, 22, 0.92);
      }
      #artDepthStack,
      #artCoreGroup {
        transform-box: fill-box;
        transform-origin: center;
      }
      .art-depth-layer {
        transform-box: fill-box;
        transform-origin: center;
        opacity: var(--layer-opacity, 0.4);
      }
      .art-depth-shape {
        fill: url(#cardDotPatternDepth);
        stroke: rgba(30, 27, 24, 0.84);
        stroke-width: 1.34;
        vector-effect: non-scaling-stroke;
      }
      #artCoreShadow {
        fill: rgba(17, 15, 13, 0.18);
        opacity: 0.12;
      }
      #artCore {
        fill: url(#cardDotPatternFront);
        stroke: rgba(21, 19, 17, 0.94);
        stroke-width: 1.58;
        vector-effect: non-scaling-stroke;
      }
      #petEcho {
        position: absolute;
        inset: 0;
        margin: auto;
        width: var(--echo-width);
        height: var(--echo-height);
        border-radius: calc(var(--card-radius) - 1px);
        border: 1px solid var(--entity-line);
        background: transparent;
        opacity: var(--echo-opacity);
        box-shadow: 0 18px 34px rgba(23, 20, 17, var(--echo-shadow-opacity));
        filter: blur(var(--echo-blur));
        transform-origin: center;
        transform: translate3d(var(--echo-x), var(--echo-y), 0) rotate(var(--echo-rotate)) scale(var(--echo-scale));
      }
      #pet {
        position: absolute;
        inset: 10px;
        width: 100px;
        height: 100px;
        opacity: 0;
        border-radius: 50%;
        border: none;
        box-shadow: none;
        object-fit: contain;
        cursor: grab;
        transition: transform 140ms ease, opacity 140ms ease;
        pointer-events: auto;
        transform: translate3d(0, 0, 0) scale(1);
      }
      #pet:hover {
        box-shadow: none;
      }
      #pet.dragging {
        cursor: grabbing;
        transform: none;
        transition: none;
      }
      #pet.dragging:hover {
        transform: none;
        box-shadow: none;
      }
      #pet.pressing {
        transform: translate3d(0, 1px, 0) scale(0.99);
      }
      #controlRail {
        display: flex;
        gap: 4px;
        pointer-events: auto;
        align-items: center;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      #controlRail.hidden {
        display: none;
      }
      .control-btn {
        border: 1px solid var(--surface-border);
        background: transparent;
        color: var(--ink-strong);
        border-radius: 999px;
        width: var(--control-size);
        height: var(--control-size);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          transform 120ms ease;
      }
      .control-btn:hover:not(:disabled) {
        background: var(--surface-muted);
        border-color: rgba(42, 40, 35, 0.2);
        transform: none;
      }
      .control-btn:active:not(:disabled) {
        background: var(--surface-active);
        transform: none;
      }
      .control-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .control-btn svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      #petWrap[data-music="1"] #petCard {
        transform:
          perspective(980px)
          translate3d(calc(var(--px) * 1.3px), calc(var(--card-shift-y) + (var(--py) * -1.35px)), 0)
          rotateX(calc((var(--py) * -25deg) + var(--card-tilt-x)))
          rotateY(calc((var(--px) * 29deg) + var(--card-tilt-y)))
          rotate(calc(var(--card-rotate) + (var(--px) * 5.6deg)));
      }
      @keyframes glyphFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(-0.15deg);
        }
        42% {
          transform: translate3d(var(--glyph-drift-x), calc(var(--glyph-drift-y) * -1), 0) rotate(var(--glyph-turn));
        }
        76% {
          transform: translate3d(calc(var(--glyph-drift-x) * -0.45), calc(var(--glyph-drift-y) * -0.12), 0) rotate(-0.35deg);
        }
      }
      @keyframes cardGlint {
        0%,
        100% {
          transform: translate3d(var(--card-glint-shift-x), var(--card-glint-shift-y), 0) rotate(0.001deg) scale(var(--card-glint-scale));
          opacity: 0.84;
        }
        50% {
          transform: translate3d(calc(var(--card-glint-shift-x) * -0.55), calc(var(--card-glint-shift-y) * -0.2), 0)
            rotate(0.001deg) scale(calc(var(--card-glint-scale) + 0.035));
          opacity: 1;
        }
      }
      @keyframes echoDrift {
        0%,
        100% {
          transform: translate3d(var(--echo-x), var(--echo-y), 0) rotate(var(--echo-rotate)) scale(var(--echo-scale));
        }
        50% {
          transform: translate3d(calc(var(--echo-x) + var(--echo-drift-x)), calc(var(--echo-y) + var(--echo-drift-y)), 0)
            rotate(calc(var(--echo-rotate) + var(--echo-drift-rotate))) scale(var(--echo-scale));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #statusPanel,
        .control-btn,
        #pet,
        #petGlyph,
        #petCard,
        #petEcho {
          transition-duration: 80ms !important;
          transition-delay: 0ms !important;
          animation: none !important;
        }
        #statusPanel,
        .control-btn {
          transform: none !important;
        }
        #petCard::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="petWrap">
      <div id="statusPanel" aria-live="polite">
        <div id="speechLine">我在。</div>
        <div id="mediaRow" class="hidden">
          <div id="mediaTitle">暂无播放</div>
          <div id="controlRail" class="hidden" aria-label="音乐控制">
            <button class="control-btn" id="btnPrev" type="button" aria-label="上一首"></button>
            <button class="control-btn" id="btnPlay" type="button" aria-label="播放或暂停"></button>
            <button class="control-btn" id="btnNext" type="button" aria-label="下一首"></button>
          </div>
        </div>
      </div>

      <div id="petShell">
        <div id="petFrame">
          <div id="petGlyph" aria-hidden="true">
            <div id="petCard">
              <div class="card-corner top">
                <span class="card-rank" id="cardRankTop">A</span>
                <span class="card-suit" id="cardSuitTop">♠</span>
              </div>
              <div id="cardSuitCenter" aria-hidden="true">
                <svg id="cardArtwork" viewBox="0 0 112 156" preserveAspectRatio="xMidYMid meet">
                  <defs>
                    <pattern id="cardDotPatternFront" x="0" y="0" width="4.2" height="4.2" patternUnits="userSpaceOnUse">
                      <rect width="4.2" height="4.2" class="art-front-dot-bg"></rect>
                      <circle cx="2.1" cy="2.1" r="0.76" class="art-front-dot-fg"></circle>
                    </pattern>
                    <pattern id="cardDotPatternDepth" x="0" y="0" width="4.2" height="4.2" patternUnits="userSpaceOnUse">
                      <rect width="4.2" height="4.2" class="art-depth-dot-bg"></rect>
                      <circle cx="2.1" cy="2.1" r="0.72" class="art-depth-dot-fg"></circle>
                    </pattern>
                  </defs>
                  <g id="artDepthStack">
                    <g class="art-depth-layer" data-i="5" style="--i: 5; --layer-opacity: 0.46">
                      <ellipse class="art-depth-shape" cx="101" cy="78" rx="49" ry="58"></ellipse>
                    </g>
                    <g class="art-depth-layer" data-i="4" style="--i: 4; --layer-opacity: 0.58">
                      <ellipse class="art-depth-shape" cx="101" cy="78" rx="49" ry="58"></ellipse>
                    </g>
                    <g class="art-depth-layer" data-i="3" style="--i: 3; --layer-opacity: 0.72">
                      <ellipse class="art-depth-shape" cx="101" cy="78" rx="49" ry="58"></ellipse>
                    </g>
                    <g class="art-depth-layer" data-i="2" style="--i: 2; --layer-opacity: 0.84">
                      <ellipse class="art-depth-shape" cx="101" cy="78" rx="49" ry="58"></ellipse>
                    </g>
                    <g class="art-depth-layer" data-i="1" style="--i: 1; --layer-opacity: 0.94">
                      <ellipse class="art-depth-shape" cx="101" cy="78" rx="49" ry="58"></ellipse>
                    </g>
                  </g>
                  <g id="artCoreGroup">
                    <ellipse id="artCoreShadow" cx="99.4" cy="79.8" rx="48.4" ry="57.2"></ellipse>
                    <ellipse id="artCore" cx="101" cy="78" rx="49" ry="58"></ellipse>
                  </g>
                </svg>
              </div>
              <div class="card-corner bottom">
                <span class="card-rank" id="cardRankBottom">A</span>
                <span class="card-suit" id="cardSuitBottom">♠</span>
              </div>
            </div>
            <div id="petEcho"></div>
          </div>
          <img id="pet" alt="Aelin" draggable="false" />
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      let fallbackIcon = params.get("icon") || "";
      const debugEnabled = params.get("debug") === "1";
      let debugSeq = 0;

      const wrap = document.getElementById("petWrap");
      const statusPanel = document.getElementById("statusPanel");
      const pet = document.getElementById("pet");
      const petCard = document.getElementById("petCard");
      const petShell = document.getElementById("petShell");
      const artDepthStack = document.getElementById("artDepthStack");
      const artCoreGroup = document.getElementById("artCoreGroup");
      const artCore = document.getElementById("artCore");
      const artCoreShadow = document.getElementById("artCoreShadow");
      const artDepthLayers = Array.from(document.querySelectorAll(".art-depth-layer"));
      const speechLine = document.getElementById("speechLine");
      const mediaRow = document.getElementById("mediaRow");
      const mediaTitle = document.getElementById("mediaTitle");
      const controlRail = document.getElementById("controlRail");
      const btnPrev = document.getElementById("btnPrev");
      const btnPlay = document.getElementById("btnPlay");
      const btnNext = document.getElementById("btnNext");
      const cardRankTop = document.getElementById("cardRankTop");
      const cardRankBottom = document.getElementById("cardRankBottom");
      const cardSuitTop = document.getElementById("cardSuitTop");
      const cardSuitBottom = document.getElementById("cardSuitBottom");
      const artLayerModels = artDepthLayers
        .map((layer, index) => {
          const shape = layer.querySelector(".art-depth-shape");
          if (!shape) return null;
          return {
            layer,
            shape,
            index: Number(layer.dataset.i || index + 1),
            cx: Number(shape.getAttribute("cx") || 0),
            cy: Number(shape.getAttribute("cy") || 0),
            rx: Number(shape.getAttribute("rx") || 0),
            ry: Number(shape.getAttribute("ry") || 0),
          };
        })
        .filter(Boolean)
        .sort((a, b) => Number(b.index || 0) - Number(a.index || 0));
      const artCoreBase = artCore
        ? {
            cx: Number(artCore.getAttribute("cx") || 0),
            cy: Number(artCore.getAttribute("cy") || 0),
            rx: Number(artCore.getAttribute("rx") || 0),
            ry: Number(artCore.getAttribute("ry") || 0),
          }
        : null;
      const artCoreShadowBase = artCoreShadow
        ? {
            cx: Number(artCoreShadow.getAttribute("cx") || 0),
            cy: Number(artCoreShadow.getAttribute("cy") || 0),
            rx: Number(artCoreShadow.getAttribute("rx") || 0),
            ry: Number(artCoreShadow.getAttribute("ry") || 0),
          }
        : null;
      const moodThemes = {
        calm: {
          fill: "#191714",
          accent: "#6e7d88",
          line: "rgba(37, 34, 30, 0.16)",
          surface: "rgba(244, 242, 236, 0.94)",
        },
        warming_up: {
          fill: "#1b1713",
          accent: "#8b7863",
          line: "rgba(52, 41, 30, 0.16)",
          surface: "rgba(245, 240, 232, 0.95)",
        },
        focused: {
          fill: "#15181c",
          accent: "#61778e",
          line: "rgba(39, 49, 60, 0.18)",
          surface: "rgba(239, 243, 247, 0.94)",
        },
        flow: {
          fill: "#151917",
          accent: "#66827c",
          line: "rgba(34, 50, 45, 0.17)",

        const leftSpace = (petCenterX - PET_RADIUS) - area.left;
        const topSpace = (petCenterY - PET_RADIUS) - area.top;
        const bottomSpace = area.bottom - (petCenterY + PET_RADIUS);
        const rightNeed = getPlacementNeed("right");
        const leftNeed = getPlacementNeed("left");
        const topNeed = getPlacementNeed("top");
        const bottomNeed = getPlacementNeed("bottom");

        if (rightSpace >= rightNeed) return "right";
        if (leftSpace >= leftNeed) return "left";

        const topOk = topSpace >= topNeed;
        const bottomOk = bottomSpace >= bottomNeed;
        if (topOk || bottomOk) {

          { placement: "left", space: leftSpace - leftNeed },
          { placement: "top", space: topSpace - topNeed },
          { placement: "bottom", space: bottomSpace - bottomNeed },
          { placement: "right", space: rightSpace - rightNeed },

          axis: placement === "top" || placement === "bottom" ? "x" : "y",
          width: compact,
          height: compact,
          petCenterX: compact / 2,
          petCenterY: compact / 2,
          panelWidth: PANEL_WIDTH,
          panelHeight: PANEL_HEIGHT,
          controlsLeft: PANEL_MARGIN,
          controlsTop: PANEL_MARGIN,

          base.height = Math.max(compact, PANEL_HEIGHT);
          base.petCenterY = Math.round(base.height / 2);

          base.controlsTop = Math.round((base.height - PANEL_HEIGHT) / 2);

        if (placement === "left") {
          base.height = Math.max(compact, PANEL_HEIGHT);
          base.petCenterY = Math.round(base.height / 2);
          base.width = compact + PANEL_WIDTH + PANEL_GAP;
          base.petCenterX = compact / 2 + PANEL_WIDTH + PANEL_GAP;
          base.controlsLeft = 0;
          base.controlsTop = Math.round((base.height - PANEL_HEIGHT) / 2);

          base.petCenterY = compact / 2 + PANEL_HEIGHT + PANEL_GAP;

      function updateCardArtworkDepth(px = 0, py = 0) {

        const coreRx = artCoreBase.rx + (absX * 0.2) - (absY * 0.78);

        setSvgNumericAttr(artCore, "cy", coreCy);
        setSvgNumericAttr(artCore, "rx", coreRx);

          const nearBias = (6 - model.index) / 5;
          const offsetX = leftReveal * model.index;
          const offsetY = verticalReveal * model.index;
          const layerCx = model.cx - offsetX + (px * model.index * 0.28);
          const layerCy = model.cy + offsetY;
          const layerRx = model.rx - (model.index * (1.1 + (absY * 0.22))) + (absX * 0.06);

      function tickPointerTilt() {

          Math.abs(pointerTiltTargetX - pointerTiltX) < 0.001 &&
          Math.abs(pointerTiltTargetY - pointerTiltY) < 0.001 &&
          Math.abs(pointerTiltTargetX) < 0.001 &&
          Math.abs(pointerTiltTargetY) < 0.001

          return;

          pointerTiltTargetY = 0;

          return;

        pointerTiltRaf = window.requestAnimationFrame(tickPointerTilt);

      function relaxPointerTilt() {

        pointerTiltTargetY = 0;

      function updatePointerTiltByPoint(clientX, clientY, options = {}) {
        if (!petCard) return;
        const rect = petCard.getBoundingClientRect();
        if (!rect.width || !rect.height) {
          relaxPointerTilt();
          return;
        }
        const globalMode = Boolean(options?.allowGlobal);
        const workArea = options?.workArea && typeof options.workArea === "object" ? options.workArea : null;
        const pad = globalMode ? Math.max(220, Number(workArea?.width || 0) * 0.18) : 34;

          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad

          relaxPointerTilt();
          return;
        }
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        ensurePointerTiltLoop();
      }

      function buildPrimaryLine(payload = {}) {
        const coach = String(payload?.coachLine || "").trim();
        if (coach) return truncateText(coach, 28);
        const workDurationMin = Math.max(0, Number(payload?.workDurationMin || 0));
        if (payload?.state === "working") {
          if (workDurationMin >= 90) return "继续下潜。";
          if (workDurationMin >= 45) return "先别切走。";
          return "我替你守着。";
        }
        if (payload?.state === "completed") {
          return "这一段稳了。";
        }
        if (payload?.state === "resting") {
          return payload?.isLateNight ? "今晚慢一点。" : "先缓一口气。";
        }
        if (payload?.hasMusic) {
          return "让声音先铺开。";
        }
        return "我在。";
      }

      function applyMoodTheme(payload = {}) {
        const emotion = payload?.emotion && typeof payload.emotion === "object" ? payload.emotion : {};
        const mood = String(emotion.mood || "calm").trim() || "calm";
        wrap.dataset.mood = mood;
        const theme = moodThemes[mood] || moodThemes.calm;
        wrap.style.setProperty("--entity-fill", theme.fill);
        wrap.style.setProperty("--entity-accent", theme.accent);
        wrap.style.setProperty("--entity-line", theme.line);
        wrap.style.setProperty("--surface-bg", theme.surface);
        wrap.style.setProperty("--surface-border", theme.line);
      }

      function quantizeUnit(value, steps = 6) {
        const clamped = clampUnit(value);
        const safeSteps = Math.max(1, Math.round(Number(steps) || 1));
        return Math.round(clamped * safeSteps) / safeSteps;
      }

      function pickRankByScale(scale, ranks) {
        const list = Array.isArray(ranks) && ranks.length ? ranks : ["J"];
        const clamped = clampUnit(scale);
        const index = Math.max(0, Math.min(list.length - 1, Math.round(clamped * (list.length - 1))));
        return String(list[index] || "J");
      }

      function symbolForSuit(suit) {
        if (suit === "heart") return "♡";
        if (suit === "diamond") return "♢";
        if (suit === "club") return "♧";
        return "♤";
      }

      function suitToneForFace(face, state) {
        if (face?.suit === "heart") return state === "resting" ? "#2a2324" : "#261f20";
        if (face?.suit === "club") return "#1d221d";
        if (face?.suit === "spade") return "#171b1f";
        return state === "resting" ? "#282428" : "#1d1b18";
      }

      function deriveCardFace(payload = {}, state, focus, energy, valence, tension) {
        const face = {
          rank: "J",
          suit: "diamond",
          symbol: "♢",
          red: false,
        };
        const workDurationMin = Math.max(0, Number(payload?.workDurationMin || 0));
        const idleSec = Math.max(0, Number(payload?.idleSec || 0));
        const focusBand = quantizeUnit(focus, 5);
        const energyBand = quantizeUnit(energy, 5);
        const valenceBand = quantizeUnit(valence, 5);
        const tensionBand = quantizeUnit(tension, 5);
        const workProgress = quantizeUnit(Math.min(workDurationMin / 90, 1), 6);
        const restDepth = quantizeUnit(
          Math.min(1, (idleSec / 1800) * 0.45 + (1 - energyBand) * 0.35 + (1 - tensionBand) * 0.2),
          6
        );

        if (state === "working") {
          face.suit = focusBand >= 0.6 || workProgress >= 0.5 ? "spade" : "diamond";
          face.rank = pickRankByScale(
            Math.max(workProgress, quantizeUnit(focusBand * 0.68 + energyBand * 0.18 + (1 - tensionBand) * 0.14, 7)),
            ["7", "8", "9", "10", "J", "Q", "K", "A"]
          );
        } else if (state === "completed") {
          face.suit = "diamond";
          face.rank = pickRankByScale(
            quantizeUnit(0.58 + valenceBand * 0.26 + focusBand * 0.16, 4),
            ["10", "J", "Q", "K", "A"]
          );
        } else if (state === "resting") {
          face.suit = payload?.isLateNight ? "heart" : valenceBand >= 0.45 ? "diamond" : "heart";
          face.rank = pickRankByScale(restDepth, ["6", "5", "4", "3", "2"]);
        } else if (payload?.hasMusic) {
          face.suit = energyBand >= 0.55 ? "club" : "diamond";
          face.rank = pickRankByScale(
            quantizeUnit(energyBand * 0.72 + valenceBand * 0.18 + focusBand * 0.1, 6),
            ["6", "7", "8", "9", "10", "J", "Q"]
          );
        } else {
          if (valenceBand >= 0.5) {
            face.suit = "diamond";
          } else if (focusBand >= 0.55) {
            face.suit = "spade";
          } else if (energyBand >= 0.55) {
            face.suit = "club";
          } else {
            face.suit = "heart";
          }
          face.rank = pickRankByScale(
            quantizeUnit(valenceBand * 0.42 + focusBand * 0.34 + (1 - tensionBand) * 0.24, 6),
            ["5", "6", "7", "8", "9", "10", "J"]
          );
        }

        face.symbol = symbolForSuit(face.suit);
        face.red = face.suit === "heart" || face.suit === "diamond";
        return face;
      }

      function renderCardFace(payload = {}) {
        const emotion = payload?.emotion && typeof payload.emotion === "object" ? payload.emotion : {};
        const state = normalizeState(payload?.state || currentState);
        const focus = clampUnit(Number(emotion.focus || 0) / 100);
        const energy = clampUnit(Number(emotion.energy || 0) / 100);
        const valence = clampUnit(Number(emotion.valence || 0) / 100);
        const tension = clampUnit(Number(emotion.tension || 0) / 100);
        const face = deriveCardFace(payload, state, focus, energy, valence, tension);
        const suitColor = suitToneForFace(face, state);

        cardRankTop.textContent = face.rank;
        cardRankBottom.textContent = face.rank;
        cardSuitTop.textContent = face.symbol;
        cardSuitBottom.textContent = face.symbol;
        wrap.style.setProperty("--card-suit-color", suitColor);
        wrap.style.setProperty("--card-ink", suitColor);
      }

      function applyEntityVisual(payload = {}) {
        const emotion = payload?.emotion && typeof payload.emotion === "object" ? payload.emotion : {};
        const state = normalizeState(payload?.state || currentState);
        const focus = clampUnit(Number(emotion.focus || 0) / 100);
        const energy = clampUnit(Number(emotion.energy || 0) / 100);
        const valence = clampUnit(Number(emotion.valence || 0) / 100);
        let cardWidth = 66;
        let cardHeight = 92;
        let cardRadius = 10.5;
        let cardRotate = 0;
        let cardShiftY = 0;
        let cardOpacity = 0.998;
        let cardShadowOpacity = 0.1;
        let cardTiltX = "0deg";
        let cardTiltY = "0deg";
        let cardRankSize = 9.5;
        let cardSuitSize = 7.4;
        let cardArtWidth = 54;
        let cardArtHeight = 76;
        let cardArtShiftX = 5.8;
        let cardArtShiftY = 0;
        let echoX = 0;
        let echoY = 1.2;
        let echoWidth = 67;
        let echoHeight = 93;
        let echoRotate = 0;
        let echoOpacity = 0.018;
        let echoScale = 1;
        let echoBlur = 0;
        let echoShadowOpacity = 0;
        let echoDriftX = 0.08;
        let echoDriftY = 0.08;
        let echoDriftRotate = 0.05;
        const glyphDuration = 12;
        const echoDuration = 12;
        const glintDuration = 14;
        const glyphDriftX = 0.08;
        const glyphDriftY = 0.1;
        const glyphTurn = 0.04;

        if (state === "working") {
          cardWidth = 67;
          cardHeight = 93;
          cardShadowOpacity = 0.11 + focus * 0.02;
        } else if (state === "completed") {
          cardWidth = 66;
          cardHeight = 92;
          cardShadowOpacity = 0.09;
        } else if (state === "resting") {
          cardWidth = payload?.isLateNight ? 62 : 64;
          cardHeight = payload?.isLateNight ? 88 : 90;
          cardOpacity = payload?.isLateNight ? 0.975 : 0.99;
          cardShadowOpacity = payload?.isLateNight ? 0.055 : 0.075;
          echoOpacity = payload?.isLateNight ? 0.012 : 0.015;
          cardArtWidth = payload?.isLateNight ? 50 : 52;
          cardArtHeight = payload?.isLateNight ? 71 : 73;
        } else if (payload?.hasMusic) {
          cardWidth = 67;
          cardHeight = 93;
          cardShadowOpacity = 0.1 + energy * 0.02;
        }

        if (payload?.coachLine) {
          cardShadowOpacity = Math.min(0.14, cardShadowOpacity + 0.01);
        }

        wrap.style.setProperty("--card-width", `${cardWidth.toFixed(1)}px`);
        wrap.style.setProperty("--card-height", `${cardHeight.toFixed(1)}px`);
        wrap.style.setProperty("--card-radius", `${cardRadius.toFixed(1)}px`);
        wrap.style.setProperty("--card-rotate", `${cardRotate.toFixed(2)}deg`);
        wrap.style.setProperty("--card-shift-y", `${cardShiftY.toFixed(2)}px`);
        wrap.style.setProperty("--card-opacity", cardOpacity.toFixed(3));
        wrap.style.setProperty("--card-bg", "rgba(255, 255, 255, 0.998)");
        wrap.style.setProperty("--card-border", "rgba(29, 28, 26, 0.88)");
        wrap.style.setProperty("--card-shadow-opacity", cardShadowOpacity.toFixed(3));
        wrap.style.setProperty("--card-shadow-x", "0px");
        wrap.style.setProperty("--card-shadow-y", "12px");
        wrap.style.setProperty("--card-shadow-blur", "28px");
        wrap.style.setProperty("--card-shadow-spread", "-14px");
        wrap.style.setProperty("--card-ambient-opacity", "0.02");
        wrap.style.setProperty("--card-tilt-x", `${cardTiltX}`);
        wrap.style.setProperty("--card-tilt-y", `${cardTiltY}`);
        wrap.style.setProperty("--card-glint-angle", "-18deg");
        wrap.style.setProperty("--card-glint-opacity", "0.004");
        wrap.style.setProperty("--card-glint-shift-x", "0px");
        wrap.style.setProperty("--card-glint-shift-y", "0px");
        wrap.style.setProperty("--card-glint-scale", "1");
        wrap.style.setProperty("--card-rank-size", `${cardRankSize.toFixed(1)}px`);
        wrap.style.setProperty("--card-suit-size", `${cardSuitSize.toFixed(1)}px`);
        wrap.style.setProperty("--card-center-size", "0px");
        wrap.style.setProperty("--card-center-rotate", "0deg");
        wrap.style.setProperty("--card-center-scale", "1");
        wrap.style.setProperty("--card-center-shadow", "none");
        wrap.style.setProperty("--card-art-width", `${cardArtWidth.toFixed(1)}px`);
        wrap.style.setProperty("--card-art-height", `${cardArtHeight.toFixed(1)}px`);
        wrap.style.setProperty("--card-art-shift-x", `${cardArtShiftX.toFixed(2)}px`);
        wrap.style.setProperty("--card-art-shift-y", `${cardArtShiftY.toFixed(2)}px`);
        wrap.style.setProperty("--card-art-rotate", "0deg");
        wrap.style.setProperty("--card-art-scale-x", "1");
        wrap.style.setProperty("--card-art-scale-y", "1");
        wrap.style.setProperty("--card-art-dot-gap", "4.6px");
        wrap.style.setProperty("--card-art-dot-size", "0.72px");
        wrap.style.setProperty("--card-art-dot-opacity", "0.92");
        wrap.style.setProperty("--card-art-rings-gap", "0px");
        wrap.style.setProperty("--card-art-rings-opacity", "0.36");
        wrap.style.setProperty("--card-art-rings-rotate", "0deg");
        wrap.style.setProperty("--card-art-rings-shift-x", "0px");
        wrap.style.setProperty("--card-art-rings-shift-y", "0px");
        wrap.style.setProperty("--card-art-rings-scale", "1");
        wrap.style.setProperty("--card-art-rings-crop-x", "83%");
        wrap.style.setProperty("--card-art-rings-crop-y", "83%");
        wrap.style.setProperty("--card-art-rings-crop-rx", "43%");
        wrap.style.setProperty("--card-art-rings-crop-ry", "24%");
        wrap.style.setProperty("--echo-x", `${echoX.toFixed(2)}px`);
        wrap.style.setProperty("--echo-y", `${echoY.toFixed(2)}px`);
        wrap.style.setProperty("--echo-width", `${echoWidth.toFixed(1)}px`);
        wrap.style.setProperty("--echo-height", `${echoHeight.toFixed(1)}px`);
        wrap.style.setProperty("--echo-rotate", `${echoRotate.toFixed(2)}deg`);
        wrap.style.setProperty("--echo-opacity", echoOpacity.toFixed(3));
        wrap.style.setProperty("--echo-scale", `${echoScale.toFixed(3)}`);
        wrap.style.setProperty("--echo-blur", `${echoBlur.toFixed(2)}px`);
        wrap.style.setProperty("--echo-shadow-opacity", `${echoShadowOpacity.toFixed(3)}`);
        wrap.style.setProperty("--echo-drift-x", `${echoDriftX.toFixed(2)}px`);
        wrap.style.setProperty("--echo-drift-y", `${echoDriftY.toFixed(2)}px`);
        wrap.style.setProperty("--echo-drift-rotate", `${echoDriftRotate.toFixed(2)}deg`);
        wrap.style.setProperty("--glyph-duration", `${glyphDuration.toFixed(2)}s`);
        wrap.style.setProperty("--echo-duration", `${echoDuration.toFixed(2)}s`);
        wrap.style.setProperty("--glint-duration", `${glintDuration.toFixed(2)}s`);
        wrap.style.setProperty("--glyph-drift-x", `${glyphDriftX.toFixed(2)}px`);
        wrap.style.setProperty("--glyph-drift-y", `${glyphDriftY.toFixed(2)}px`);
        wrap.style.setProperty("--glyph-turn", `${glyphTurn.toFixed(2)}deg`);
        wrap.dataset.state = state;
        wrap.dataset.music = payload?.hasMusic ? "1" : "0";
        wrap.dataset.coach = payload?.coachLine ? "1" : "0";
      }

      function renderPanelContent(payload = {}) {
        speechLine.textContent = buildPrimaryLine(payload);
      }

      function setHoverActive(active) {
        const next = Boolean(active);
        if (desiredHoverActive === next) return;
        petDebug("renderer:hover-active", {
          prev: desiredHoverActive,
          next,
          pointerActive,
          dragging,
        });
        desiredHoverActive = next;
        if (!next) {
          controlsPlacementLock = "";
        }
        scheduleLayoutSync();
      }

      function setPanelsVisible(visible) {
        const next = Boolean(visible);
        if (wrap.classList.contains("panels-visible") === next) return;
        petDebug("renderer:panels-visible", { next });
        wrap.classList.toggle("panels-visible", next);
      }

      function beginPendingPlayVisual(intentId, expectedIsPlaying) {
        pendingPlayVisual = {
          intentId: Number(intentId || 0),
          expectedIsPlaying: Boolean(expectedIsPlaying),
          expiresAt: Date.now() + PLAY_VISUAL_STALE_GUARD_MS,
        };
      }

      function clearPendingPlayVisual(reason = "") {
        if (!pendingPlayVisual) return;
        petDebug("renderer:media-play-pending-clear", {
          intentId: Number(pendingPlayVisual.intentId || 0),
          reason: String(reason || ""),
        });
        pendingPlayVisual = null;
      }

      function resolvePlayVisualState(rawIsPlaying) {
        const incoming = Boolean(rawIsPlaying);
        if (!pendingPlayVisual) return incoming;
        const now = Date.now();
        if (now > Number(pendingPlayVisual.expiresAt || 0)) {
          clearPendingPlayVisual("expired");
          return incoming;
        }
        if (incoming === Boolean(pendingPlayVisual.expectedIsPlaying)) {
          clearPendingPlayVisual("ack");
          return incoming;
        }
        return Boolean(pendingPlayVisual.expectedIsPlaying);
      }

      function setMusicPanel(payload) {
        const media = payload?.media && typeof payload.media === "object" ? payload.media : null;
        const musicNames = Array.isArray(payload?.musicDisplayNames)
          ? payload.musicDisplayNames.filter((item) => typeof item === "string" && item.trim())
          : [];
        const hasMediaDetail = !!(media && (media.title || media.artist || media.app));
        const hasMusic = Boolean(payload?.hasMusic) || musicNames.length > 0 || hasMediaDetail;
        controlRail.classList.add("hidden");
        mediaRow.classList.add("hidden");
        if (!hasMusic) {
          latestMedia = null;
          controlsPlacementLock = "";
          clearPendingPlayVisual("no_music");
          btnPrev.disabled = true;
          btnPlay.disabled = true;
          btnNext.disabled = true;
          setButtonIcon(btnPlay, "play");
          mediaTitle.textContent = "";
          scheduleLayoutSync();
          return;
        }

        const visualIsPlaying = resolvePlayVisualState(media?.isPlaying);
        latestMedia = media && typeof media === "object" ? { ...media, isPlaying: visualIsPlaying } : { isPlaying: visualIsPlaying };

        const mediaControllable = Boolean(media && media.available && (media.canPlay || media.canPause || media.canNext || media.canPrev));
        btnPrev.disabled = !hasMusic || (mediaControllable && !media?.canPrev);
        btnNext.disabled = !hasMusic || (mediaControllable && !media?.canNext);
        btnPlay.disabled = !hasMusic || (mediaControllable && !(media?.canPlay || media?.canPause));
        setButtonIcon(btnPlay, visualIsPlaying ? "pause" : "play");

        scheduleLayoutSync();
      }

      function applyState(payload, force = false) {
        const nextPayload = payload && typeof payload === "object" ? { ...payload } : {};
        const nextState = normalizeState(nextPayload?.state || currentState);
        const sameState = nextState === currentState;
        lastPayload = {
          ...lastPayload,
          ...nextPayload,
          state: nextState,
        };

        if (!sameState || force) {
          currentState = nextState;
          pet.dataset.state = nextState;
          const src = sourceForState(nextState);
          if (src && pet.src !== src) {
            pet.src = src;
          }
        }

        applyMoodTheme(lastPayload);
        applyEntityVisual(lastPayload);
        renderCardFace(lastPayload);
        renderPanelContent(lastPayload);
        setMusicPanel(lastPayload);
        scheduleLayoutSync();
      }

      function applyConfig(config, force = false) {
        if (config && typeof config === "object") {
          if (config.icon) fallbackIcon = String(config.icon);
          if (Number.isFinite(Number(config.compactSize))) {
            petLayoutConfig.compactSize = Math.max(96, Math.round(Number(config.compactSize)));
            lastLayoutKey = "";
            currentAnchorX = petLayoutConfig.compactSize / 2;
            currentAnchorY = petLayoutConfig.compactSize / 2;
          }
          if (config.stateAssets && typeof config.stateAssets === "object") {
            stateAssets = { ...config.stateAssets };
          }
          if (typeof config.clickThroughEnabled === "boolean") {
            clickThroughEnabled = config.clickThroughEnabled;
            clearDeactivateTimer();
            setPointerActive(false);
          }
        }
        applyState({ ...lastPayload, state: config?.state || currentState }, force);
        scheduleLayoutSync(true);
      }

      function isInsidePet(clientX, clientY) {
        const rect = pet.getBoundingClientRect();
        const pad = 4;
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function isInsideRect(el, clientX, clientY, pad = 2) {
        if (!wrap.classList.contains("panels-visible")) return false;
        if (!el || el.classList.contains("hidden")) return false;
        const rect = el.getBoundingClientRect();
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function mergeRect(base, next) {
        if (!base) return next ? { ...next } : null;
        if (!next) return { ...base };
        return {
          left: Math.min(base.left, next.left),
          top: Math.min(base.top, next.top),
          right: Math.max(base.right, next.right),
          bottom: Math.max(base.bottom, next.bottom),
        };
      }

      function buildInteractiveRect() {
        let rect = null;
        const petRect = pet?.getBoundingClientRect?.();
        if (petRect) {
          rect = mergeRect(rect, petRect);
        }
        if (wrap.classList.contains("panels-visible")) {
          if (statusPanel) {
            rect = mergeRect(rect, statusPanel.getBoundingClientRect());
          }
        }
        return rect;
      }

      function isInsideInteractive(clientX, clientY) {
        if (isInsidePet(clientX, clientY)) return true;
        if (isInsideRect(statusPanel, clientX, clientY, 3)) return true;
        if (desiredHoverActive || wrap.classList.contains("panels-visible")) {
          const rect = buildInteractiveRect();
          if (!rect) return false;
          if (
            clientX >= rect.left - HOVER_SAFE_ZONE_PADDING &&
            clientX <= rect.right + HOVER_SAFE_ZONE_PADDING &&
            clientY >= rect.top - HOVER_SAFE_ZONE_PADDING &&
            clientY <= rect.bottom + HOVER_SAFE_ZONE_PADDING
          ) {
            return true;
          }
        }
        return false;
      }

      function clearDeactivateTimer() {
        if (!deactivateTimer) return;
        clearTimeout(deactivateTimer);
        deactivateTimer = null;
      }

      function schedulePointerInactive() {
        if (dragging) return;
        clearDeactivateTimer();
        petDebug("renderer:pointer-inactive-scheduled", {
          delayMs: DEACTIVATE_DELAY_MS,
          pointerActive,
        });
        deactivateTimer = setTimeout(() => {
          deactivateTimer = null;
          const now = Date.now();
          const recentlyInside = now - Number(lastInsideInteractiveAt || 0) < DEACTIVATE_DELAY_MS;
          const holdActive = pointerActive && (now - Number(pointerActivatedAt || 0) < POINTER_ACTIVE_HOLD_MS);
          if (recentlyInside || holdActive) {
            petDebug("renderer:pointer-inactive-delayed", {
              recentlyInside,
              holdActive,
              pointerActive,
            });
            schedulePointerInactive();
            return;
          }
          petDebug("renderer:pointer-inactive-commit", { pointerActive });
          setPointerActive(false);
        }, DEACTIVATE_DELAY_MS);
      }

      function syncPointerByPoint(clientX, clientY) {
        if (isInsideInteractive(clientX, clientY)) {
          lastInsideInteractiveAt = Date.now();
          clearDeactivateTimer();
          setPointerActive(true);
          return;
        }
        schedulePointerInactive();
      }

      function setPointerActive(next) {
        const active = Boolean(next);
        const now = Date.now();
        const canExpand = active && !dragging && now >= Number(suppressExpandUntil || 0);
        if (pointerActive === active) {
          const nextHover = canExpand;
          if (desiredHoverActive !== nextHover) {
            setHoverActive(nextHover);
          }
          return;
        }
        const prev = pointerActive;
        pointerActive = active;
        if (active) {
          pointerActivatedAt = Date.now();
        } else {
          relaxPointerTilt();
        }
        petDebug("renderer:pointer-active", {
          prev,
          next: active,
          canExpand,
          dragging,
          clickThroughEnabled,
        });
        setHoverActive(canExpand);
        if (clickThroughEnabled) {
          window.petBridge?.setPointerActive(active);
        }
      }

      function scheduleHoverSync(clientX, clientY, options = {}) {
        pendingHoverPoint = {
          x: Number(clientX),
          y: Number(clientY),
          allowGlobal: Boolean(options?.allowGlobal),
          workArea: options?.workArea && typeof options.workArea === "object"
            ? {
                x: Number(options.workArea.x || 0),
                y: Number(options.workArea.y || 0),
                width: Number(options.workArea.width || 0),
                height: Number(options.workArea.height || 0),
              }
            : null,
        };
        if (hoverSyncRaf) return;
        hoverSyncRaf = window.requestAnimationFrame(() => {
          hoverSyncRaf = 0;
          const point = pendingHoverPoint;
          pendingHoverPoint = null;
          if (!point || dragging) return;
          syncPointerByPoint(point.x, point.y);
          updatePointerTiltByPoint(point.x, point.y, point);
        });
      }

      function forceCollapsePanels(reason = "") {
        desiredHoverActive = false;
        controlsPlacementLock = "";
        lastInsideInteractiveAt = 0;
        clearDeactivateTimer();
        relaxPointerTilt();
        cancelPanelsVisibleRaf();
        setPanelsVisible(false);
        petDebug("renderer:force-collapse", {
          reason: String(reason || ""),
          pointerActive,
          dragging,
        });
        if (clickThroughEnabled) {
          pointerActive = false;
          window.petBridge?.setPointerActive(false);
        }
        scheduleLayoutSync(true);
      }

      async function runMediaAction(action, payload = {}) {
        try {
          const result = await window.petBridge?.mediaControl?.(action, payload);
          if (result?.state) {
            applyState(result.state, true);
          }
          return result || { ok: false, detail: "empty_result" };
        } catch {
          // ignore control errors in UI
          return { ok: false, detail: "ui_bridge_error" };
        }
      }

      function setOptimisticPlayVisual(isPlaying, intentId = 0) {
        beginPendingPlayVisual(intentId, isPlaying);
        if (!latestMedia || typeof latestMedia !== "object") {
          latestMedia = {};
        }
        latestMedia = {
          ...latestMedia,
          isPlaying: Boolean(isPlaying),
        };
        setButtonIcon(btnPlay, latestMedia.isPlaying ? "pause" : "play");
      }

      btnPrev.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("previous");
      });
      btnPlay.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const wasPlaying = Boolean(latestMedia?.isPlaying);
        const nextPlaying = !wasPlaying;
        const previousMedia = latestMedia && typeof latestMedia === "object" ? { ...latestMedia } : null;
        const intentId = ++mediaControlIntentSeq;
        const action = wasPlaying ? "pause" : "play";
        const canDirect = wasPlaying ? latestMedia?.canPause : latestMedia?.canPlay;
        setOptimisticPlayVisual(nextPlaying, intentId);
        petDebug("renderer:media-play-optimistic", {
          intentId,
          action: canDirect ? action : "play_pause",
          wasPlaying,
          nextPlaying,
        });
        void (async () => {
          const result = await runMediaAction(canDirect ? action : "play_pause");
          if (intentId !== mediaControlIntentSeq) return;
          if (result?.ok) return;
          clearPendingPlayVisual("rollback");
          latestMedia = previousMedia;
          setButtonIcon(btnPlay, previousMedia?.isPlaying ? "pause" : "play");
          petDebug("renderer:media-play-rollback", {
            intentId,
            detail: String(result?.detail || ""),
          });
        })();
      });
      btnNext.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("next");
      });

      [pet, statusPanel].forEach((el) => {
        el?.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          window.petBridge?.openMenu({
            screenX: event.screenX,
            screenY: event.screenY,
          });
        });

        el?.addEventListener("mouseup", (event) => {
          if (event.button !== 2) return;
          event.preventDefault();
          window.petBridge?.openMenu({
            screenX: event.screenX,
            screenY: event.screenY,
          });
        });
      });

      pet.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || !event.isPrimary) return;
        event.preventDefault();
        clearDeactivateTimer();
        relaxPointerTilt();
        setPointerActive(true);
        dragging = true;
        petDebug("renderer:drag-start", {
          pointerId: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY,
          screenX: event.screenX,
          screenY: event.screenY,
        });
        wrap.classList.add("dragging-panels-hidden");
        moved = false;
        setHoverActive(false);
        scheduleLayoutSync(true);
        activePointerId = event.pointerId;
        startX = event.screenX;
        startY = event.screenY;
        if (typeof pet.setPointerCapture === "function") {
          try {
            pet.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        const localX = event.clientX;
        const localY = event.clientY;
        pet.classList.add("dragging");
        pet.classList.add("pressing");
        window.petBridge?.dragStart({
          screenX: event.screenX,
          screenY: event.screenY,
          localX,
          localY,
        });
      });

      pet.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        if (!event.isPrimary || event.pointerId !== activePointerId) return;
        const dx = Math.abs(event.screenX - startX);
        const dy = Math.abs(event.screenY - startY);
        if (dx > 2 || dy > 2) moved = true;
        window.petBridge?.dragMove({ screenX: event.screenX, screenY: event.screenY });
      });

      function finishPointerDrag(event, cancelled = false) {
        if (!dragging) return;
        if (event && event.pointerId !== undefined && event.pointerId !== activePointerId) return;
        const wasMoved = moved;
        dragging = false;
        petDebug("renderer:drag-end", {
          cancelled: Boolean(cancelled),
          wasMoved: Boolean(wasMoved),
          pointerId: activePointerId,
        });
        if (wasMoved) {
          suppressExpandUntil = Date.now() + DRAG_END_REOPEN_GUARD_MS;
          petDebug("renderer:drag-end-suppress-expand", {
            until: suppressExpandUntil,
            guardMs: DRAG_END_REOPEN_GUARD_MS,
          });
          setHoverActive(false);
        }
        wrap.classList.remove("dragging-panels-hidden");
        moved = false;
        scheduleLayoutSync(true);
        const pointerId = activePointerId;
        activePointerId = null;
        if (pointerId !== null && typeof pet.releasePointerCapture === "function") {
          try {
            if (typeof pet.hasPointerCapture !== "function" || pet.hasPointerCapture(pointerId)) {
              pet.releasePointerCapture(pointerId);
            }
          } catch {
            // ignore release capture failures
          }
        }
        pet.classList.remove("dragging");
        pet.classList.remove("pressing");
        window.petBridge?.dragEnd();
        if (!cancelled && !wasMoved && event?.button === 0) {
          window.petBridge?.openChat();
        }
        if (event && !wasMoved) {
          syncPointerByPoint(event.clientX, event.clientY);
        } else {
          lastAppliedBounds = null;
          schedulePointerInactive();
        }
      }

      pet.addEventListener("pointerup", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, false);
      });

      pet.addEventListener("pointercancel", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, true);
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) {
          scheduleHoverSync(event.clientX, event.clientY);
        }
      });

      pet.addEventListener("dblclick", (event) => {
        event.preventDefault();
        window.petBridge?.openChat();
      });

      [pet, statusPanel].forEach((el) => {
        el?.addEventListener("mouseenter", (event) => {
          if (dragging) return;
          syncPointerByPoint(event.clientX, event.clientY);
          updatePointerTiltByPoint(event.clientX, event.clientY);
        });
      });

      window.addEventListener("mouseleave", () => {
        relaxPointerTilt();
        if (!dragging) schedulePointerInactive();
      });

      const offState = window.petBridge?.onState?.((payload) => {
        applyState(payload || {});
      });
      const offConfig = window.petBridge?.onConfig?.((payload) => {
        applyConfig(payload || {});
      });
      const offForceCollapse = window.petBridge?.onForceCollapse?.((payload) => {
        petDebug("renderer:force-collapse-recv", {
          reason: String(payload?.reason || ""),
          ts: Number(payload?.ts || 0),
        });
        forceCollapsePanels(String(payload?.reason || ""));
      });
      const offCursor = window.petBridge?.onCursor?.((payload) => {
        const cursor = payload?.cursor && typeof payload.cursor === "object" ? payload.cursor : null;
        const windowBounds = payload?.windowBounds && typeof payload.windowBounds === "object" ? payload.windowBounds : null;
        if (!cursor || !windowBounds || dragging) return;
        const localX = Number(cursor.x || 0) - Number(windowBounds.x || 0);
        const localY = Number(cursor.y || 0) - Number(windowBounds.y || 0);
        if (!Number.isFinite(localX) || !Number.isFinite(localY)) return;
        scheduleHoverSync(localX, localY, {
          allowGlobal: true,
          workArea: payload?.workArea || null,
        });
      });

      window.petBridge?.getConfig?.().then((config) => {
        applyConfig(config || {}, true);
      }).catch(() => {
        if (fallbackIcon) pet.src = fallbackIcon;
      });

      if (fallbackIcon && !pet.getAttribute("src")) {
        pet.src = fallbackIcon;
      }

      applyPointerTiltVars(0, 0);

      window.addEventListener("beforeunload", () => {
        clearDeactivateTimer();
        clearCompactCommitTimer();
        cancelPanelsVisibleRaf();
        if (hoverSyncRaf) window.cancelAnimationFrame(hoverSyncRaf);
        if (layoutSyncRaf) window.cancelAnimationFrame(layoutSyncRaf);
        if (pointerTiltRaf) window.cancelAnimationFrame(pointerTiltRaf);
        if (typeof offState === "function") offState();
        if (typeof offConfig === "function") offConfig();
        if (typeof offForceCollapse === "function") offForceCollapse();
        if (typeof offCursor === "function") offCursor();
      });
    </script>
  </body>
</html>
