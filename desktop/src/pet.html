<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      #petWrap {
        position: relative;
        width: 100%;
        height: 100%;
        --pet-center-y: 50%;
        --music-top: 8px;
        --work-top: 168px;
        --work-max-h: 56px;
        --panel-width: 212px;
        pointer-events: auto;
      }
      #petShell {
        position: absolute;
        left: 50%;
        top: var(--pet-center-y);
        transform: translate(-50%, -50%);
      }
      #pet {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
        object-fit: cover;
        cursor: grab;
        transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
        pointer-events: auto;
      }
      #pet:hover {
        transform: scale(1.035);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.4);
      }
      #pet.dragging {
        cursor: grabbing;
        transform: none;
        transition: none;
      }
      #pet.dragging:hover {
        transform: none;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
      }
      #pet.pressing {
        transform: none;
      }
      #pet[data-state="resting"] {
        filter: saturate(0.92) brightness(0.94);
      }
      #pet[data-state="working"] {
        filter: saturate(1.18) brightness(1.02);
      }
      #pet[data-state="completed"] {
        filter: saturate(1.08) brightness(1.05);
      }
      #pet[data-state="happy"] {
        filter: none;
      }
      #stateBadge {
        position: absolute;
        left: 50%;
        bottom: -12px;
        transform: translateX(-50%);
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        line-height: 14px;
        color: #f4f4f5;
        background: rgba(15, 23, 42, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
        white-space: nowrap;
        pointer-events: none;
      }
      .pet-panel {
        position: absolute;
        left: 50%;
        width: min(var(--panel-width), calc(100% - 12px));
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: rgba(16, 23, 36, 0.82);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
        color: #f9fafb;
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%);
        transition: opacity 90ms ease;
      }
      .panels-visible .pet-panel {
        opacity: 1;
        pointer-events: auto;
      }
      .pet-panel.hidden {
        display: none;
      }
      #petWrap.dragging-panels-hidden .pet-panel {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      #musicPanel {
        top: var(--music-top);
        padding: 6px 10px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-blend-mode: overlay;
        overflow: hidden;
        isolation: isolate;
      }
      #musicPanel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.5);
        z-index: 2;
        pointer-events: none;
      }
      #musicPanel::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.2));
        z-index: 0;
        pointer-events: none;
      }
      #musicPanel.with-cover {
        background-color: rgba(7, 12, 20, 0.74);
      }
      #musicTitle {
        position: relative;
        z-index: 1;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #musicMeta {
        position: relative;
        z-index: 1;
        margin-top: 2px;
        font-size: 10px;
        color: rgba(226, 232, 240, 0.88);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #musicControls {
        position: relative;
        z-index: 1;
        margin-top: 6px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 4px;
      }
      .music-btn {
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(15, 23, 42, 0.62);
        color: #f8fafc;
        border-radius: 9px;
        height: 24px;
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .music-btn:hover:not(:disabled) {
        background: rgba(30, 41, 59, 0.82);
        border-color: rgba(255, 255, 255, 0.36);
        transform: translateY(-1px);
      }
      .music-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .music-btn svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      #btnPlay {
        background: rgba(13, 148, 136, 0.28);
        border-color: rgba(45, 212, 191, 0.36);
      }
      #btnPlay:hover:not(:disabled) {
        background: rgba(13, 148, 136, 0.4);
        border-color: rgba(94, 234, 212, 0.56);
      }
      #volumeWrap {
        grid-column: span 3;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #volumeSlider {
        width: 100%;
        accent-color: #f8fafc;
      }
      .icon-only {
        display: inline-flex;
      }
      #workPanel {
        top: var(--work-top);
        padding: 8px 10px;
        max-height: var(--work-max-h);
        min-height: 32px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      #workText {
        font-size: 11px;
        line-height: 1.4;
      }
      #coachText {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.4;
        color: rgba(191, 219, 254, 0.95);
      }
      #coachText.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="petWrap">
      <div id="musicPanel" class="pet-panel hidden">
        <div id="musicTitle">未播放音乐</div>
        <div id="musicMeta">将自动显示曲名和歌手</div>
        <div id="musicControls">
          <button class="music-btn" id="btnPrev" type="button" aria-label="上一首"></button>
          <button class="music-btn" id="btnPlay" type="button" aria-label="播放或暂停"></button>
          <button class="music-btn" id="btnNext" type="button" aria-label="下一首"></button>
          <div id="volumeWrap">
            <button class="music-btn" id="btnVolDown" type="button" aria-label="降低音量"></button>
            <input id="volumeSlider" type="range" min="0" max="100" value="50" step="2" />
            <button class="music-btn" id="btnVolUp" type="button" aria-label="提高音量"></button>
          </div>
        </div>
      </div>

      <div id="petShell">
        <img id="pet" alt="Aelin" draggable="false" />
        <div id="stateBadge">开心</div>
      </div>

      <div id="workPanel" class="pet-panel">
        <div id="workText">当前没有检测到工作进程哦主人~</div>
        <div id="coachText" class="hidden"></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      let fallbackIcon = params.get("icon") || "";
      const debugEnabled = params.get("debug") !== "0";
      let debugSeq = 0;

      const wrap = document.getElementById("petWrap");
      const pet = document.getElementById("pet");
      const badge = document.getElementById("stateBadge");
      const musicPanel = document.getElementById("musicPanel");
      const musicTitle = document.getElementById("musicTitle");
      const musicMeta = document.getElementById("musicMeta");
      const btnPrev = document.getElementById("btnPrev");
      const btnPlay = document.getElementById("btnPlay");
      const btnNext = document.getElementById("btnNext");
      const btnVolDown = document.getElementById("btnVolDown");
      const btnVolUp = document.getElementById("btnVolUp");
      const volumeSlider = document.getElementById("volumeSlider");
      const workPanel = document.getElementById("workPanel");
      const workText = document.getElementById("workText");
      const coachText = document.getElementById("coachText");

      const stateLabels = {
        happy: "开心",
        completed: "完成",
        resting: "休息",
        working: "工作",
      };

      let stateAssets = {};
      let clickThroughEnabled = true;
      let currentState = "happy";
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let activePointerId = null;
      let pointerActive = false;
      let deactivateTimer = null;
      let volumeDebounceTimer = null;
      let latestMedia = null;
      let hoverSyncRaf = 0;
      let pendingHoverPoint = null;
      let layoutSyncRaf = 0;
      let compactCommitTimer = 0;
      let lastLayoutKey = "";
      let desiredHoverActive = false;
      let visualLayoutMode = "compact";
      let lastInsideInteractiveAt = 0;
      let pointerActivatedAt = 0;
      let suppressExpandUntil = 0;
      const petLayoutConfig = {
        compactSize: 128,
        expandedWidth: 236,
        expandedMaxHeight: 420,
      };
      const DEACTIVATE_DELAY_MS = 180;
      const HOVER_SAFE_ZONE_PADDING = 12;
      const PANEL_FADE_MS = 100;
      const POINTER_ACTIVE_HOLD_MS = 140;
      const DRAG_END_REOPEN_GUARD_MS = 260;
      const iconMarkup = {
        prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-8.5 6L18 18V6Z"></path><path d="M7 6v12"></path></svg>',
        next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8.5 6L6 18V6Z"></path><path d="M17 6v12"></path></svg>',
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l10 6-10 6V6Z"></path></svg>',
        pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12"></path><path d="M15 6v12"></path></svg>',
        volDown: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 7.8 9H5v6h2.8L11 18V6Z"></path><path d="M15 12h4"></path></svg>',
        volUp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 7.8 9H5v6h2.8L11 18V6Z"></path><path d="M15 12h4"></path><path d="M17 10v4"></path></svg>',
      };

      function petDebug(tag, data = {}) {
        if (!debugEnabled) return;
        debugSeq += 1;
        const payload = {
          tag: String(tag || "event"),
          seq: debugSeq,
          ts: Date.now(),
          data: data && typeof data === "object" ? data : { value: String(data || "") },
        };
        try {
          window.petBridge?.debugLog?.(payload);
        } catch {
          // ignore debug bridge failures
        }
        try {
          console.debug(`[pet-debug][${payload.seq}] ${payload.tag}`, payload.data);
        } catch {
          // ignore console failures
        }
      }

      function setButtonIcon(button, name) {
        if (!button) return;
        button.innerHTML = iconMarkup[name] || "";
      }

      setButtonIcon(btnPrev, "prev");
      setButtonIcon(btnPlay, "play");
      setButtonIcon(btnNext, "next");
      setButtonIcon(btnVolDown, "volDown");
      setButtonIcon(btnVolUp, "volUp");

      function hashHue(input) {
        const text = String(input || "");
        let hash = 0;
        for (let i = 0; i < text.length; i += 1) {
          hash = (hash * 31 + text.charCodeAt(i)) % 360;
        }
        return Math.abs(hash % 360);
      }

      function buildFallbackCover(title, artist, app) {
        const key = `${title}|${artist}|${app}`;
        const hue = hashHue(key);
        const hueB = (hue + 55) % 360;
        const hueC = (hue + 140) % 360;
        return [
          "radial-gradient(circle at 84% 18%,",
          `hsla(${hueC}, 88%, 62%, 0.42) 0%,`,
          "transparent 42%),",
          `linear-gradient(136deg, hsl(${hue} 82% 53%) 0%, hsl(${hueB} 86% 57%) 56%, hsl(${hueC} 78% 51%) 100%),`,
          "linear-gradient(rgba(8,12,20,0.38), rgba(8,12,20,0.82))",
        ].join(" ");
      }

      function computeShellLayout() {
        const width = Math.max(petLayoutConfig.expandedWidth, petLayoutConfig.compactSize);
        const height = Math.max(width, Math.round(Number(petLayoutConfig.expandedMaxHeight || 420)));
        const petCenterY = Math.round(Math.max(72, Math.min(height - 96, height * 0.39)));
        return {
          width,
          height,
          petCenterY,
        };
      }

      function computeExpandedLayout() {
        const shell = computeShellLayout();
        const musicVisible = !musicPanel.classList.contains("hidden");
        const panelGap = 8;
        const topPadding = 8;
        const bottomPadding = 8;
        const petSize = 96;
        const musicHeight = musicVisible ? Math.ceil(musicPanel.scrollHeight || 0) : 0;
        const petTop = Math.max(topPadding, Math.round(shell.petCenterY - petSize / 2));
        const musicTop = Math.max(topPadding, Math.round(petTop - panelGap - musicHeight));
        const workTop = Math.round(shell.petCenterY + petSize / 2 + panelGap);
        const workMaxHeight = Math.max(40, shell.height - workTop - bottomPadding);
        return {
          mode: "expanded",
          width: shell.width,
          height: shell.height,
          musicTop,
          petCenterY: shell.petCenterY,
          workTop,
          workMaxHeight,
        };
      }

      function applyLayoutVars(layout) {
        if (!layout || layout.mode !== "expanded") {
          const shell = computeShellLayout();
          const workTop = Math.round(shell.petCenterY + 56);
          const workMaxHeight = Math.max(40, shell.height - workTop - 8);
          wrap.style.setProperty("--panel-width", "212px");
          wrap.style.setProperty("--pet-center-y", `${shell.petCenterY}px`);
          wrap.style.setProperty("--music-top", "8px");
          wrap.style.setProperty("--work-top", `${workTop}px`);
          wrap.style.setProperty("--work-max-h", `${workMaxHeight}px`);
          return;
        }
        wrap.style.setProperty("--panel-width", `${Math.max(160, layout.width - 24)}px`);
        wrap.style.setProperty("--pet-center-y", `${Math.round(layout.petCenterY)}px`);
        wrap.style.setProperty("--music-top", `${Math.round(layout.musicTop)}px`);
        wrap.style.setProperty("--work-top", `${Math.round(layout.workTop)}px`);
        wrap.style.setProperty("--work-max-h", `${Math.round(layout.workMaxHeight)}px`);
      }

      function clearCompactCommitTimer() {
        if (!compactCommitTimer) return;
        clearTimeout(compactCommitTimer);
        compactCommitTimer = 0;
        petDebug("renderer:compact-timer-clear");
      }

      function sendLayoutToMainSync(layout, mode) {
        const shell = computeShellLayout();
        const payload = {
          mode: "expanded",
          width: Math.round(shell.width),
          height: Math.round(shell.height),
          anchorX: Math.round(shell.width / 2),
          anchorY: Math.round(shell.petCenterY),
        };
        const key = `${payload.width}|${payload.height}|${payload.anchorX}|${payload.anchorY}`;
        if (key === lastLayoutKey) {
          petDebug("renderer:layout-skip-same-key", { key });
          return true;
        }
        lastLayoutKey = key;
        try {
          if (typeof window.petBridge?.applyLayoutSync === "function") {
            const result = window.petBridge.applyLayoutSync(payload);
            if (result && result.ok === false) {
              throw new Error("layout sync failed");
            }
            petDebug("renderer:layout-sync", {
              mode: String(mode || "expanded"),
              width: payload.width,
              height: payload.height,
              anchorX: payload.anchorX,
              anchorY: payload.anchorY,
              applied: result?.applied || null,
            });
          } else if (typeof window.petBridge?.setLayout === "function") {
            window.petBridge.setLayout(payload);
            petDebug("renderer:layout-async-fallback", {
              mode: String(mode || "expanded"),
              width: payload.width,
              height: payload.height,
              anchorX: payload.anchorX,
              anchorY: payload.anchorY,
            });
          }
          return true;
        } catch {
          lastLayoutKey = "";
          petDebug("renderer:layout-error", {
            mode: payload.mode,
            width: payload.width,
            height: payload.height,
            anchorX: payload.anchorX,
            anchorY: payload.anchorY,
          });
          return false;
        }
      }

      function commitCompactLayout() {
        clearCompactCommitTimer();
        applyLayoutVars(null);
        sendLayoutToMainSync(null, "compact");
        visualLayoutMode = "compact";
        petDebug("renderer:compact-commit", {
          desiredHoverActive,
          dragging,
          pointerActive,
        });
      }

      function scheduleCompactLayoutCommit() {
        if (compactCommitTimer) return;
        petDebug("renderer:compact-timer-set", {
          delayMs: PANEL_FADE_MS,
          desiredHoverActive,
          dragging,
          pointerActive,
        });
        compactCommitTimer = window.setTimeout(() => {
          compactCommitTimer = 0;
          if (desiredHoverActive || dragging) {
            petDebug("renderer:compact-timer-abort", {
              desiredHoverActive,
              dragging,
            });
            scheduleLayoutSync(true);
            return;
          }
          petDebug("renderer:compact-timer-fire");
          commitCompactLayout();
        }, PANEL_FADE_MS);
      }

      function syncLayoutNow() {
        const expanded = desiredHoverActive && !dragging;
        if (expanded) {
          clearCompactCommitTimer();
          const layout = computeExpandedLayout();
          applyLayoutVars(layout);
          const applied = sendLayoutToMainSync(layout, "expanded");
          if (!applied) return;
          visualLayoutMode = "expanded";
          petDebug("renderer:expanded-commit", {
            width: layout.width,
            height: layout.height,
            petCenterY: layout.petCenterY,
            workTop: layout.workTop,
            musicVisible: !musicPanel.classList.contains("hidden"),
          });
          setPanelsVisible(true);
          return;
        }
        setPanelsVisible(false);
        if (dragging) {
          commitCompactLayout();
          return;
        }
        if (visualLayoutMode === "compact") {
          commitCompactLayout();
          return;
        }
        scheduleCompactLayoutCommit();
      }

      function scheduleLayoutSync(force = false) {
        if (force && layoutSyncRaf) {
          cancelAnimationFrame(layoutSyncRaf);
          layoutSyncRaf = 0;
        }
        if (layoutSyncRaf) return;
        layoutSyncRaf = requestAnimationFrame(() => {
          layoutSyncRaf = 0;
          syncLayoutNow();
        });
      }

      function normalizeState(raw) {
        const value = String(raw || "").trim().toLowerCase();
        if (value === "happy" || value === "completed" || value === "resting" || value === "working") return value;
        if (value === "active") return "happy";
        if (value === "idle" || value === "sleep") return "resting";
        if (value === "busy" || value === "focus") return "working";
        return "happy";
      }

      function stateLabel(state, payload) {
        const base = stateLabels[state] || stateLabels.happy;
        const idleSec = Number(payload?.idleSec || 0);
        if (state === "resting" && idleSec > 0) {
          return `${base} ${Math.floor(idleSec)}s`;
        }
        if (state === "working") {
          const mins = Number(payload?.workDurationMin || 0);
          if (mins > 0) return `${base} ${mins}m`;
        }
        return base;
      }

      function sourceForState(state) {
        return stateAssets[state] || stateAssets.happy || fallbackIcon || "";
      }

      function setHoverActive(active) {
        const next = Boolean(active);
        if (desiredHoverActive === next) return;
        petDebug("renderer:hover-active", {
          prev: desiredHoverActive,
          next,
          pointerActive,
          dragging,
        });
        desiredHoverActive = next;
        scheduleLayoutSync();
      }

      function setPanelsVisible(visible) {
        const next = Boolean(visible);
        if (wrap.classList.contains("panels-visible") === next) return;
        petDebug("renderer:panels-visible", { next });
        wrap.classList.toggle("panels-visible", next);
      }

      function setMusicPanel(payload) {
        const media = payload?.media && typeof payload.media === "object" ? payload.media : null;
        latestMedia = media;
        const musicNames = Array.isArray(payload?.musicDisplayNames)
          ? payload.musicDisplayNames.filter((item) => typeof item === "string" && item.trim())
          : [];
        const hasMediaDetail = !!(media && (media.title || media.artist || media.app));
        const hasMusic = Boolean(payload?.hasMusic) || musicNames.length > 0 || hasMediaDetail;
        musicPanel.classList.toggle("hidden", !hasMusic);
        if (!hasMusic) {
          musicPanel.classList.remove("with-cover");
          musicPanel.style.backgroundImage = "";
          scheduleLayoutSync();
          return;
        }

        const fallbackPlayer = musicNames[0] || String(media?.app || "").trim() || "音乐播放器";
        const title = String(media?.title || "").trim() || `${fallbackPlayer} 正在运行`;
        const artist = String(media?.artist || "").trim();
        const status = media?.isPlaying ? "播放中" : "待机中";
        const app = String(media?.app || "").trim();
        const coverDataUrl = String(media?.coverDataUrl || "").trim();

        musicTitle.textContent = title;
        musicMeta.textContent = [artist || fallbackPlayer, status, app].filter(Boolean).join(" · ");
        if (coverDataUrl) {
          musicPanel.classList.add("with-cover");
          musicPanel.style.backgroundImage = `linear-gradient(rgba(8,12,20,0.45), rgba(8,12,20,0.8)), url('${coverDataUrl}')`;
        } else {
          musicPanel.classList.add("with-cover");
          musicPanel.style.backgroundImage = buildFallbackCover(title, artist || fallbackPlayer, app || fallbackPlayer);
        }

        const mediaControllable = Boolean(media && media.available && (media.canPlay || media.canPause || media.canNext || media.canPrev));
        btnPrev.disabled = !hasMusic || (mediaControllable && !media?.canPrev);
        btnNext.disabled = !hasMusic || (mediaControllable && !media?.canNext);
        btnPlay.disabled = !hasMusic || (mediaControllable && !(media?.canPlay || media?.canPause));
        setButtonIcon(btnPlay, media?.isPlaying ? "pause" : "play");

        const volume = Number(media?.volume);
        if (Number.isFinite(volume)) {
          volumeSlider.value = String(Math.max(0, Math.min(100, Math.round(volume))));
        }
        scheduleLayoutSync();
      }

      function setWorkPanel(payload) {
        const narration = String(payload?.workNarration || "").trim() || "当前没有检测到工作进程哦主人~";
        workText.textContent = narration;

        const line = String(payload?.coachLine || "").trim();
        if (line) {
          coachText.textContent = line;
          coachText.classList.remove("hidden");
        } else {
          coachText.textContent = "";
          coachText.classList.add("hidden");
        }
        scheduleLayoutSync();
      }

      function applyState(payload, force = false) {
        const nextState = normalizeState(payload?.state || currentState);
        const sameState = nextState === currentState;

        if (!sameState || force) {
          currentState = nextState;
          pet.dataset.state = nextState;
          const src = sourceForState(nextState);
          if (src && pet.src !== src) {
            pet.src = src;
          }
        }

        badge.textContent = stateLabel(nextState, payload);
        setMusicPanel(payload || {});
        setWorkPanel(payload || {});
        scheduleLayoutSync();
      }

      function applyConfig(config, force = false) {
        if (config && typeof config === "object") {
          if (config.icon) fallbackIcon = String(config.icon);
          if (Number.isFinite(Number(config.compactSize))) {
            petLayoutConfig.compactSize = Math.max(96, Math.round(Number(config.compactSize)));
            lastLayoutKey = "";
          }
          if (Number.isFinite(Number(config.expandedWidth))) {
            petLayoutConfig.expandedWidth = Math.max(200, Math.round(Number(config.expandedWidth)));
          }
          if (Number.isFinite(Number(config.expandedMaxHeight))) {
            petLayoutConfig.expandedMaxHeight = Math.max(240, Math.round(Number(config.expandedMaxHeight)));
          }
          if (config.stateAssets && typeof config.stateAssets === "object") {
            stateAssets = { ...config.stateAssets };
          }
          if (typeof config.clickThroughEnabled === "boolean") {
            clickThroughEnabled = config.clickThroughEnabled;
            clearDeactivateTimer();
            setPointerActive(false);
          }
        }
        applyState({ state: config?.state || currentState }, force);
        scheduleLayoutSync(true);
      }

      function isInsidePet(clientX, clientY) {
        const rect = pet.getBoundingClientRect();
        const pad = 4;
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function isInsideRect(el, clientX, clientY, pad = 2) {
        if (!wrap.classList.contains("panels-visible")) return false;
        if (!el || el.classList.contains("hidden")) return false;
        const rect = el.getBoundingClientRect();
        return (
          clientX >= rect.left - pad &&
          clientX <= rect.right + pad &&
          clientY >= rect.top - pad &&
          clientY <= rect.bottom + pad
        );
      }

      function mergeRect(base, next) {
        if (!base) return next ? { ...next } : null;
        if (!next) return { ...base };
        return {
          left: Math.min(base.left, next.left),
          top: Math.min(base.top, next.top),
          right: Math.max(base.right, next.right),
          bottom: Math.max(base.bottom, next.bottom),
        };
      }

      function buildInteractiveRect() {
        let rect = null;
        const petRect = pet?.getBoundingClientRect?.();
        if (petRect) {
          rect = mergeRect(rect, petRect);
        }
        if (wrap.classList.contains("panels-visible")) {
          if (musicPanel && !musicPanel.classList.contains("hidden")) {
            rect = mergeRect(rect, musicPanel.getBoundingClientRect());
          }
          if (workPanel && !workPanel.classList.contains("hidden")) {
            rect = mergeRect(rect, workPanel.getBoundingClientRect());
          }
        }
        return rect;
      }

      function isInsideInteractive(clientX, clientY) {
        if (isInsidePet(clientX, clientY)) return true;
        if (isInsideRect(musicPanel, clientX, clientY, 3)) return true;
        if (isInsideRect(workPanel, clientX, clientY, 3)) return true;
        if (desiredHoverActive || wrap.classList.contains("panels-visible")) {
          const rect = buildInteractiveRect();
          if (!rect) return false;
          if (
            clientX >= rect.left - HOVER_SAFE_ZONE_PADDING &&
            clientX <= rect.right + HOVER_SAFE_ZONE_PADDING &&
            clientY >= rect.top - HOVER_SAFE_ZONE_PADDING &&
            clientY <= rect.bottom + HOVER_SAFE_ZONE_PADDING
          ) {
            return true;
          }
        }
        return false;
      }

      function clearDeactivateTimer() {
        if (!deactivateTimer) return;
        clearTimeout(deactivateTimer);
        deactivateTimer = null;
      }

      function schedulePointerInactive() {
        if (dragging) return;
        clearDeactivateTimer();
        petDebug("renderer:pointer-inactive-scheduled", {
          delayMs: DEACTIVATE_DELAY_MS,
          pointerActive,
        });
        deactivateTimer = setTimeout(() => {
          deactivateTimer = null;
          const now = Date.now();
          const recentlyInside = now - Number(lastInsideInteractiveAt || 0) < DEACTIVATE_DELAY_MS;
          const holdActive = pointerActive && (now - Number(pointerActivatedAt || 0) < POINTER_ACTIVE_HOLD_MS);
          if (recentlyInside || holdActive) {
            petDebug("renderer:pointer-inactive-delayed", {
              recentlyInside,
              holdActive,
              pointerActive,
            });
            schedulePointerInactive();
            return;
          }
          petDebug("renderer:pointer-inactive-commit", { pointerActive });
          setPointerActive(false);
        }, DEACTIVATE_DELAY_MS);
      }

      function syncPointerByPoint(clientX, clientY) {
        if (isInsideInteractive(clientX, clientY)) {
          lastInsideInteractiveAt = Date.now();
          clearDeactivateTimer();
          setPointerActive(true);
          return;
        }
        schedulePointerInactive();
      }

      function setPointerActive(next) {
        const active = Boolean(next);
        const now = Date.now();
        const canExpand = active && !dragging && now >= Number(suppressExpandUntil || 0);
        if (pointerActive === active) {
          const nextHover = canExpand;
          if (desiredHoverActive !== nextHover) {
            setHoverActive(nextHover);
          }
          return;
        }
        const prev = pointerActive;
        pointerActive = active;
        if (active) {
          pointerActivatedAt = Date.now();
        }
        petDebug("renderer:pointer-active", {
          prev,
          next: active,
          canExpand,
          dragging,
          clickThroughEnabled,
        });
        setHoverActive(canExpand);
        if (clickThroughEnabled) {
          window.petBridge?.setPointerActive(active);
        }
      }

      function scheduleHoverSync(clientX, clientY) {
        pendingHoverPoint = { x: clientX, y: clientY };
        if (hoverSyncRaf) return;
        hoverSyncRaf = window.requestAnimationFrame(() => {
          hoverSyncRaf = 0;
          const point = pendingHoverPoint;
          pendingHoverPoint = null;
          if (!point || dragging) return;
          syncPointerByPoint(point.x, point.y);
        });
      }

      function forceCollapsePanels(reason = "") {
        desiredHoverActive = false;
        lastInsideInteractiveAt = 0;
        clearDeactivateTimer();
        setPanelsVisible(false);
        petDebug("renderer:force-collapse", {
          reason: String(reason || ""),
          pointerActive,
          dragging,
        });
        if (clickThroughEnabled) {
          pointerActive = false;
          window.petBridge?.setPointerActive(false);
        }
        scheduleLayoutSync(true);
      }

      async function runMediaAction(action, payload = {}) {
        try {
          const result = await window.petBridge?.mediaControl?.(action, payload);
          if (result?.state) {
            applyState(result.state, true);
          }
        } catch {
          // ignore control errors in UI
        }
      }

      btnPrev.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("previous");
      });
      btnPlay.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const action = latestMedia?.isPlaying ? "pause" : "play";
        const canDirect = latestMedia?.isPlaying ? latestMedia?.canPause : latestMedia?.canPlay;
        runMediaAction(canDirect ? action : "play_pause");
      });
      btnNext.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("next");
      });
      btnVolDown.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("volume_down");
      });
      btnVolUp.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runMediaAction("volume_up");
      });
      volumeSlider.addEventListener("input", (event) => {
        event.stopPropagation();
        const value = Number(event.target?.value || 0);
        if (volumeDebounceTimer) clearTimeout(volumeDebounceTimer);
        volumeDebounceTimer = setTimeout(() => {
          runMediaAction("set_volume", { value });
        }, 150);
      });

      pet.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        window.petBridge?.openMenu({
          screenX: event.screenX,
          screenY: event.screenY,
        });
      });

      pet.addEventListener("mouseup", (event) => {
        if (event.button !== 2) return;
        event.preventDefault();
        window.petBridge?.openMenu({
          screenX: event.screenX,
          screenY: event.screenY,
        });
      });

      pet.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || !event.isPrimary) return;
        event.preventDefault();
        clearDeactivateTimer();
        setPointerActive(true);
        dragging = true;
        petDebug("renderer:drag-start", {
          pointerId: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY,
          screenX: event.screenX,
          screenY: event.screenY,
        });
        wrap.classList.add("dragging-panels-hidden");
        moved = false;
        setHoverActive(false);
        scheduleLayoutSync(true);
        activePointerId = event.pointerId;
        startX = event.screenX;
        startY = event.screenY;
        if (typeof pet.setPointerCapture === "function") {
          try {
            pet.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        const localX = event.clientX;
        const localY = event.clientY;
        pet.classList.add("dragging");
        pet.classList.add("pressing");
        window.petBridge?.dragStart({
          screenX: event.screenX,
          screenY: event.screenY,
          localX,
          localY,
        });
      });

      pet.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        if (!event.isPrimary || event.pointerId !== activePointerId) return;
        const dx = Math.abs(event.screenX - startX);
        const dy = Math.abs(event.screenY - startY);
        if (dx > 2 || dy > 2) moved = true;
        window.petBridge?.dragMove({ screenX: event.screenX, screenY: event.screenY });
      });

      function finishPointerDrag(event, cancelled = false) {
        if (!dragging) return;
        if (event && event.pointerId !== undefined && event.pointerId !== activePointerId) return;
        const wasMoved = moved;
        dragging = false;
        petDebug("renderer:drag-end", {
          cancelled: Boolean(cancelled),
          wasMoved: Boolean(wasMoved),
          pointerId: activePointerId,
        });
        if (wasMoved) {
          suppressExpandUntil = Date.now() + DRAG_END_REOPEN_GUARD_MS;
          petDebug("renderer:drag-end-suppress-expand", {
            until: suppressExpandUntil,
            guardMs: DRAG_END_REOPEN_GUARD_MS,
          });
          setHoverActive(false);
        }
        wrap.classList.remove("dragging-panels-hidden");
        moved = false;
        scheduleLayoutSync(true);
        const pointerId = activePointerId;
        activePointerId = null;
        if (pointerId !== null && typeof pet.releasePointerCapture === "function") {
          try {
            if (typeof pet.hasPointerCapture !== "function" || pet.hasPointerCapture(pointerId)) {
              pet.releasePointerCapture(pointerId);
            }
          } catch {
            // ignore release capture failures
          }
        }
        pet.classList.remove("dragging");
        pet.classList.remove("pressing");
        window.petBridge?.dragEnd();
        if (!cancelled && !wasMoved && event?.button === 0) {
          window.petBridge?.openChat();
        }
        if (event && !wasMoved) {
          syncPointerByPoint(event.clientX, event.clientY);
        } else {
          schedulePointerInactive();
        }
      }

      pet.addEventListener("pointerup", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, false);
      });

      pet.addEventListener("pointercancel", (event) => {
        if (!event.isPrimary) return;
        finishPointerDrag(event, true);
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) {
          scheduleHoverSync(event.clientX, event.clientY);
        }
      });

      pet.addEventListener("dblclick", (event) => {
        event.preventDefault();
        window.petBridge?.openChat();
      });

      [pet, musicPanel, workPanel].forEach((el) => {
        el?.addEventListener("mouseenter", (event) => {
          if (dragging) return;
          syncPointerByPoint(event.clientX, event.clientY);
        });
      });

      window.addEventListener("mouseleave", () => {
        if (!dragging) schedulePointerInactive();
      });

      const offState = window.petBridge?.onState?.((payload) => {
        applyState(payload || {});
      });
      const offConfig = window.petBridge?.onConfig?.((payload) => {
        applyConfig(payload || {});
      });
      const offForceCollapse = window.petBridge?.onForceCollapse?.((payload) => {
        petDebug("renderer:force-collapse-recv", {
          reason: String(payload?.reason || ""),
          ts: Number(payload?.ts || 0),
        });
        forceCollapsePanels(String(payload?.reason || ""));
      });

      window.petBridge?.getConfig?.().then((config) => {
        applyConfig(config || {}, true);
      }).catch(() => {
        if (fallbackIcon) pet.src = fallbackIcon;
      });

      if (fallbackIcon && !pet.getAttribute("src")) {
        pet.src = fallbackIcon;
      }

      window.addEventListener("beforeunload", () => {
        clearDeactivateTimer();
        clearCompactCommitTimer();
        if (volumeDebounceTimer) clearTimeout(volumeDebounceTimer);
        if (hoverSyncRaf) window.cancelAnimationFrame(hoverSyncRaf);
        if (layoutSyncRaf) window.cancelAnimationFrame(layoutSyncRaf);
        if (typeof offState === "function") offState();
        if (typeof offConfig === "function") offConfig();
        if (typeof offForceCollapse === "function") offForceCollapse();
      });
    </script>
  </body>
</html>
