<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
      }
      #pet {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.38);
        object-fit: cover;
        cursor: grab;
        transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
        animation: floaty 2.6s ease-in-out infinite;
      }
      #pet::selection {
        background: transparent;
      }
      #pet:hover {
        transform: scale(1.04);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.45);
        filter: saturate(1.1);
      }
      #pet.dragging {
        cursor: grabbing;
        transform: scale(0.97);
        animation: none;
      }
      #pet.pressing {
        transform: scale(0.96);
      }
      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-2px);
        }
      }
    </style>
  </head>
  <body>
    <img id="pet" alt="Aelin" draggable="false" />
    <script>
      const params = new URLSearchParams(location.search);
      const icon = params.get("icon") || "";
      const pet = document.getElementById("pet");
      if (icon) pet.src = icon;

      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;

      pet.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        window.petBridge?.openMenu({
          screenX: event.screenX,
          screenY: event.screenY,
        });
      });
      pet.addEventListener("mouseup", (event) => {
        if (event.button !== 2) return;
        event.preventDefault();
        window.petBridge?.openMenu({
          screenX: event.screenX,
          screenY: event.screenY,
        });
      });

      pet.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        dragging = true;
        moved = false;
        startX = event.screenX;
        startY = event.screenY;
        pet.classList.add("dragging");
        pet.classList.add("pressing");
        window.petBridge?.dragStart({ screenX: event.screenX, screenY: event.screenY });
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) return;
        const dx = Math.abs(event.screenX - startX);
        const dy = Math.abs(event.screenY - startY);
        if (dx > 2 || dy > 2) moved = true;
        window.petBridge?.dragMove({ screenX: event.screenX, screenY: event.screenY });
      });

      window.addEventListener("mouseup", (event) => {
        if (!dragging) return;
        dragging = false;
        pet.classList.remove("dragging");
        pet.classList.remove("pressing");
        window.petBridge?.dragEnd();
        if (!moved && event.button === 0) {
          window.petBridge?.openChat();
        }
      });

      pet.addEventListener("dblclick", (event) => {
        event.preventDefault();
        window.petBridge?.openChat();
      });
    </script>
  </body>
  </html>
