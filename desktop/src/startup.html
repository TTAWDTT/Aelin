<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aelin 正在启动</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #120f0d;
        --bg-soft: #1b1714;
        --panel: rgba(29, 24, 20, 0.86);
        --panel-border: rgba(255, 246, 231, 0.1);
        --text-strong: #f6eee1;
        --text-muted: rgba(246, 238, 225, 0.74);
        --accent: #f2c58f;
        --accent-soft: rgba(242, 197, 143, 0.18);
        --glow-a: rgba(234, 170, 92, 0.22);
        --glow-b: rgba(126, 81, 46, 0.18);
        --shadow: 0 24px 90px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 18% 22%, var(--glow-a) 0, transparent 34%),
          radial-gradient(circle at 82% 18%, var(--glow-b) 0, transparent 28%),
          linear-gradient(145deg, #100d0c 0%, #171210 46%, #0f0c0b 100%);
        color: var(--text-strong);
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        inset: auto;
        width: 420px;
        height: 420px;
        border-radius: 999px;
        filter: blur(80px);
        opacity: 0.34;
        pointer-events: none;
      }

      body::before {
        top: -140px;
        right: -80px;
        background: rgba(242, 197, 143, 0.14);
      }

      body::after {
        left: -120px;
        bottom: -180px;
        background: rgba(189, 132, 79, 0.12);
      }

      .shell {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        padding: 26px;
      }

      .panel {
        position: relative;
        width: min(560px, calc(100vw - 40px));
        padding: 30px 32px 28px;
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
          var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.04) 24%, transparent 48%);
        transform: translateX(-100%);
        animation: shimmer 3.2s ease-in-out infinite;
        pointer-events: none;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }

      .brand-mark {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.18), transparent 34%),
          linear-gradient(145deg, rgba(242, 197, 143, 0.28), rgba(154, 104, 64, 0.2));
        border: 1px solid rgba(242, 197, 143, 0.2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .brand-mark::after {
        content: "A";
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #fff4e5;
      }

      .brand-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand-eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(246, 238, 225, 0.55);
      }

      .brand-name {
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .headline {
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.14;
        letter-spacing: -0.03em;
        margin: 0 0 12px;
      }

      .subline {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-muted);
      }

      .status-card {
        display: grid;
        gap: 10px;
        padding: 18px 18px 16px;
        border-radius: 20px;
        background: rgba(255, 248, 240, 0.04);
        border: 1px solid rgba(255, 242, 226, 0.08);
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 28px;
      }

      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 8px var(--accent-soft);
        animation: pulse 1.8s ease-in-out infinite;
        flex: 0 0 auto;
      }

      .status-stage {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .status-detail {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-muted);
        min-height: 20px;
        padding-left: 24px;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        font-size: 12px;
        color: rgba(246, 238, 225, 0.48);
      }

      .route-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(255, 248, 240, 0.04);
        border: 1px solid rgba(255, 242, 226, 0.08);
      }

      .route-pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(242, 197, 143, 0.82);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.92);
          box-shadow: 0 0 0 0 var(--accent-soft);
          opacity: 0.86;
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 0 10px rgba(242, 197, 143, 0.07);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-130%);
        }
        55%,
        100% {
          transform: translateX(150%);
        }
      }

      @media (max-width: 640px) {
        .panel {
          padding: 24px 22px 22px;
          border-radius: 22px;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .panel::before,
        .status-dot {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-live="polite">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-meta">
            <div class="brand-eyebrow">DeepAgents Native Shell</div>
            <div class="brand-name">Aelin</div>
          </div>
        </div>
        <h1 class="headline">本地工作区正在醒来。</h1>
        <p class="subline">
          桌面壳层会先显示出来，后端、Agent Server 与前端界面继续在后台热启动。
          这样即使首次预热稍慢，你也能知道 Aelin 现在卡在了哪一步。
        </p>
        <div class="status-card">
          <div class="status-row">
            <div class="status-dot" aria-hidden="true"></div>
            <div class="status-stage" id="statusStage">正在准备本地工作区...</div>
          </div>
          <div class="status-detail" id="statusDetail">请稍候，Aelin 正在连接本地服务。</div>
        </div>
        <div class="footer">
          <div class="route-pill">
            <span id="routeLabel">目标模块：/</span>
          </div>
          <div id="timestamp">等待下一阶段...</div>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const route = params.get("route") || "/";
        const routeLabel = document.getElementById("routeLabel");
        const statusStage = document.getElementById("statusStage");
        const statusDetail = document.getElementById("statusDetail");
        const timestamp = document.getElementById("timestamp");

        function formatNow() {
          const now = new Date();
          return now.toLocaleTimeString("zh-CN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          });
        }

        routeLabel.textContent = `目标模块：${route}`;
        timestamp.textContent = `启动中 ${formatNow()}`;

        window.__AELIN_STARTUP__ = {
          setStage(payload = {}) {
            const stage = String(payload.stage || "").trim();
            const detail = String(payload.detail || "").trim();
            const nextRoute = String(payload.route || route).trim() || "/";
            if (stage) {
              statusStage.textContent = stage;
              document.title = `${stage} - Aelin`;
            }
            statusDetail.textContent = detail || "请稍候，Aelin 正在连接本地服务。";
            routeLabel.textContent = `目标模块：${nextRoute}`;
            timestamp.textContent = `最近更新 ${formatNow()}`;
          },
        };
      })();
    </script>
  </body>
</html>
